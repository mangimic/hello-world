<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- PWA -->
<meta name="theme-color" content="#4a7fd6">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernprofi">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">

<title>Deutsch üben</title>
<style>
/* =========================================================
   MOBILE-FIRST GRUNDLAYOUT
   ========================================================= */
:root{
  --bg:#eef4fb; --card:#ffffff;
  --primary:#4a7fd6; --primary-dark:#3a67b0;
  --green:#5bb98c; --green-dark:#489a72;
  --yellow:#f5c451; --text:#2c3a4b; --muted:#6b7a8d; --soft:#dce7f4;
  --blue-ink:#1c56b3;
  --radius:18px; --shadow:0 6px 18px rgba(60,90,140,0.12);
  --nav-h:66px; --tap:48px;
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  --safe-top:env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; overflow-x:hidden; max-width:100%;}
body{
  font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5; font-size:18px;
  padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 12px);
  -webkit-text-size-adjust:100%;
}
.app{width:100%; max-width:760px; margin:0 auto; padding:12px; padding-top:calc(12px + var(--safe-top));}
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px;}
h1{font-size:24px; margin:0 0 8px;}
h2{font-size:21px; margin:0 0 12px;}
h3{font-size:18px; margin:0 0 8px;}
p{margin:0 0 12px;}
.muted{color:var(--muted); font-size:16px;}
.center{text-align:center;}
.mt{margin-top:12px;}

/* Buttons */
button{
  font-family:inherit; font-size:18px; cursor:pointer; border:none; border-radius:14px;
  padding:14px 18px; min-height:var(--tap); touch-action:manipulation;
  transition:transform .08s ease, background .15s ease;
}
button:active{transform:scale(0.97);}
.btn-primary{background:var(--primary); color:#fff; font-weight:700; width:100%; padding:18px; font-size:20px; min-height:58px;}
.btn-secondary{background:var(--soft); color:var(--text); font-weight:600;}
.btn-green{background:var(--green); color:#fff; font-weight:700; width:100%;}
.btn-small{font-size:16px; padding:10px 16px;}
.btn-quiet{background:transparent; color:var(--muted); font-size:14px; text-decoration:underline; padding:10px; min-height:auto;}
@media (hover:hover){
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-secondary:hover{background:#cdddf0;}
  .btn-green:hover{background:var(--green-dark);}
}

/* Auswahl-Karten (Lernfeld / Thema) */
.choice-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0;}
.choice{
  background:var(--soft); border:3px solid transparent; border-radius:14px; padding:10px 10px;
  text-align:center; font-size:15px; font-weight:700; color:var(--text); min-height:74px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
}
.choice .emoji{display:block; font-size:26px; margin-bottom:4px;}
.choice.selected{border-color:var(--primary); background:#e4eefb;}

/* Klassenstufen-Auswahl */
.level-row{display:flex; gap:8px; margin:6px 0 12px;}
.level-btn{flex:1; background:var(--soft); color:var(--text); font-weight:700; border-radius:14px; min-height:46px; font-size:16px;}
.level-btn.active{background:var(--primary); color:#fff;}
/* Themen-Auswahl (2x2) */
.theme-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0 4px;}

/* Chips */
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0;}
.chip{background:#e4eefb; border:2px solid var(--primary); color:var(--primary-dark);
  border-radius:20px; padding:8px 14px; font-weight:700; font-size:15px;}
button.chip{cursor:pointer; min-height:auto; font-family:inherit; line-height:1.2;}
button.chip.on{background:var(--primary); color:#fff;}
@media (hover:hover){ button.chip:hover{background:#d3e3f8;} button.chip.on:hover{background:var(--primary-dark);} }

/* "So geht's" */
.howto{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
.howto-step{display:flex; align-items:center; gap:12px; background:var(--soft); border-radius:14px; padding:12px;}
.howto-step .n{background:var(--primary); color:#fff; width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-weight:800; flex:0 0 auto;}

.hint{background:#fff8e6; border-left:4px solid var(--yellow); padding:12px 14px; border-radius:8px; font-size:20px; margin:12px 0;}
.example-box{background:var(--soft); border-radius:14px; padding:14px; font-size:19px; margin:10px 0;}
.feedback{margin-top:10px; padding:12px 14px; border-radius:12px; font-size:17px; font-weight:700;}
.feedback.ok{background:#e6f6ee; color:var(--green-dark);}
.feedback.tip{background:#fff8e6; color:#a67c19;}
/* Kompass: Lesetext & Quiz-Optionen */
.lesetext{font-size:18px; line-height:1.65;}
.quiz-opt{display:block; width:100%; margin:6px 0; text-align:left; background:var(--soft); color:var(--text); font-weight:600; border-radius:12px; padding:12px 14px; font-size:17px;}
.quiz-opt.ok{background:#e6f6ee;}
.quiz-opt.no{background:#fbeceb;}

/* Wörter zum Antippen (Subjekt) */
.sentence-box{font-size:22px; line-height:2.2; margin:10px 0;}
.word{display:inline-block; padding:2px 6px; margin:2px 0; border-radius:8px; cursor:pointer;
  border-bottom:3px solid transparent;}
.word.sel{color:var(--blue-ink); font-weight:700; border-bottom-color:var(--blue-ink); background:#eaf1fc;}
.word.selp{color:#b23b3b; font-weight:700; border-bottom-color:#b23b3b; background:#fbeceb;}
.word.selr{color:#7a4fb3; font-weight:700; border-bottom-color:#7a4fb3; background:#f1ebfa;}
@media (hover:hover){ .word:hover{background:#eef2f8;} }
.wa-target{background:#fff4d6; border-radius:6px; padding:2px 8px; font-weight:800; color:#a67c19;}

/* Lösung */
.gate-count{background:var(--soft); border-radius:12px; padding:12px; margin:8px 0; font-size:17px;}
.final-solution{background:#eaf7f0; border-radius:14px; padding:16px; font-size:18px; line-height:1.7;}
.final-solution ol{padding-left:22px; margin:6px 0 0;}
.final-solution li{margin:8px 0;}
.btn-locked{background:#e6e9ee; color:#9aa6b4;}
#worksheet .sol-list{padding-left:22px;}
#worksheet .sol-list li{margin:8px 0;}

/* Blumentopf-Skala */
.crit{background:var(--soft); border-radius:14px; padding:12px; margin-bottom:10px;}
.crit .frage{font-size:17px; font-weight:600; margin-bottom:8px;}
.pot-row{display:flex; gap:8px; justify-content:space-between;}
.pot{
  flex:1 1 0; max-width:78px; background:#fff; border:3px solid transparent; border-radius:14px;
  padding:6px 2px 4px; min-height:var(--tap); cursor:pointer; display:flex; flex-direction:column; align-items:center;
}
.pot svg{width:100%; height:auto; max-width:52px; opacity:.5; filter:grayscale(.55); transition:all .15s;}
.pot .plabel{font-size:11px; color:var(--muted); font-weight:700; margin-top:2px;}
.pot.selected{border-color:var(--green); background:#eaf7f0;}
.pot.selected svg{opacity:1; filter:none;}
.pot.selected .plabel{color:var(--green-dark);}

/* Häkchenliste */
.checklist{list-style:none; padding:0; margin:0;}
.checklist li{display:flex; align-items:center; gap:12px; padding:14px; background:var(--soft);
  border-radius:12px; margin-bottom:8px; font-size:17px; min-height:var(--tap); cursor:pointer;}
.checklist input{width:26px; height:26px; flex:0 0 auto;}

/* "Deine Blume" */
.bloom{background:#eaf7f0; border-radius:18px; padding:20px; text-align:center;}
.bloom svg{width:120px; height:auto;}
.bloom .txt{font-size:19px; font-weight:700; color:var(--green-dark); margin-top:8px;}

/* Untere Navigation (dynamisch) */
.bottom-nav{position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex;
  background:var(--card); box-shadow:0 -4px 16px rgba(60,90,140,0.12); padding-bottom:var(--safe-bottom);}
.nav-item{flex:1; background:transparent; border:none; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px; height:var(--nav-h); min-height:var(--tap);
  color:var(--muted); font-size:11px; font-weight:600; border-radius:0; padding:2px;}
.nav-item .ni{font-size:23px; line-height:1;}
.nav-item.active{color:var(--primary);}

/* Screens */
.screen{display:none;}
.screen.active{display:block;}

@media (min-width:600px){
  .choice-grid{grid-template-columns:repeat(3,1fr);}
  body{font-size:19px;}
}

/* Arbeitsblatt (Vorschau) */
#worksheet{background:#fff; color:#000; border:1px solid #ccc; border-radius:8px; padding:20px; font-size:16px;}
#worksheet .ws-head{display:flex; align-items:center; gap:12px; border:2px solid #000; border-radius:10px; padding:10px 14px; margin-bottom:14px;}
#worksheet .ws-head .pen{font-size:30px;}
#worksheet h2{font-size:19px; margin:0;}
#worksheet .ws-name{margin:14px 0; font-size:17px;}
#worksheet .ws-level{display:inline-block; border:1.5px solid #000; border-radius:6px; padding:2px 10px; font-size:14px; font-weight:700; margin:0 0 12px;}
#worksheet .ws-task{background:#f2f6fc; border:1.5px solid #000; border-radius:8px; padding:10px 12px; margin:12px 0; font-size:15px; line-height:1.45;}
#worksheet .ws-box{border:1.5px solid #000; border-radius:8px; padding:10px; margin:12px 0;}
#worksheet .ws-step{margin:20px 0;}
#worksheet .ws-step .lead{font-weight:700; margin-bottom:2px;}
#worksheet .ws-step .cue{color:#555; font-size:14px; margin-bottom:12px;}
#worksheet .writeline{border-bottom:1.6px solid #333; height:46px; margin:0 0 12px;}
#worksheet .starters{font-size:14px; color:#333; border:1.2px dashed #666; border-radius:8px; padding:8px 10px; margin:12px 0;}
#worksheet .ws-check{margin-top:12px;}
#worksheet .ws-check .cline{display:flex; align-items:center; gap:8px; margin:6px 0; font-size:15px;}
#worksheet .ws-check .cbox{width:18px; height:18px; border:1.6px solid #000; border-radius:3px; flex:0 0 auto;}

/* Druck */
@media print{
  @page{ margin:14mm; }
  body{background:#fff; padding:0; font-size:12pt;}
  .app{max-width:none; padding:0;}
  .bottom-nav, .screen{display:none !important;}
  #printArea{display:block !important;}
  #worksheet{border:none; border-radius:0; padding:0; font-size:12pt;}
  #worksheet .writeline{height:12mm;}
}
#printArea{display:none;}

/* Stufen-/Level-System */
.lvl-badge{display:inline-block; background:var(--soft); color:var(--primary-dark);
  border-radius:999px; padding:3px 12px; font-size:13px; font-weight:800; letter-spacing:.01em;}
.lvl-note{margin-top:10px; text-align:center; font-size:14px; line-height:1.45; color:var(--text);
  background:#eef6ff; border:1.5px solid #cfe2fb; border-radius:12px; padding:9px 12px;}
.lvl-note.up{background:#e9f9ec; border-color:#bfe6c8;}
.lvl-note.crown{background:#fff5da; border-color:#f0dca0;}
.card-lvl{display:block; margin-top:6px; font-size:12px; font-weight:800; color:var(--primary-dark);
  background:var(--soft); border-radius:999px; padding:2px 8px;}
.lvl-row{margin:4px 0 2px;}

/* Zurück-Button + Elternbereich */
.back-btn{background:none; border:none; color:var(--primary-dark); font-size:16px; font-weight:800;
  padding:6px 2px 2px; margin:0 0 4px; min-height:auto; cursor:pointer; text-align:left;}
.linklike{background:none; border:none; color:var(--muted, #5b6b86); font-size:14px; font-weight:600;
  min-height:auto; padding:6px 10px; cursor:pointer; text-decoration:underline;}
.adm-row{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
.adm-row input{flex:1; min-width:0; font-size:15px; padding:8px 10px; border:1.5px solid #cfe2fb; border-radius:10px;}
.adm-row .del{background:#fdecec; color:#b3402f; border-radius:10px; min-height:auto; padding:8px 10px; font-size:15px;}
.adm-head{display:flex; justify-content:space-between; align-items:baseline; margin:10px 0 6px;}
.adm-head h4{margin:0; font-size:15px;}
.seg-line{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 0; border-bottom:1px solid #eef2f9;}
.seg-line:last-child{border-bottom:none;}
.seg-label{font-size:14px; font-weight:600; flex:1; min-width:0;}
.seg-row{display:flex; gap:4px; flex:0 0 auto;}
.seg{min-height:auto; padding:6px 10px; border-radius:8px; background:var(--soft); color:var(--text);
  font-size:13px; font-weight:700; border:1.5px solid transparent;}
.seg.on{background:var(--primary); color:#fff;}
.seg:disabled{opacity:.35;}

/* Schnell-Klicker-Bremse: gesperrter Weiter-Knopf + Feedback-Puls */
button.locked{opacity:.45; pointer-events:none;}
.feedback{animation:fbpulse .5s ease;}
@keyframes fbpulse{0%{transform:scale(.96); opacity:.4;} 100%{transform:scale(1); opacity:1;}}
@media (prefers-reduced-motion: reduce){ .feedback{animation:none;} }

/* Level-Up Feier-Overlay */
.lvlup-overlay{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
  background:rgba(20,35,60,.55); padding:20px;}
.lvlup-overlay.show{display:flex;}
.lvlup-overlay canvas{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
.lvlup-card{position:relative; background:#fff; border-radius:22px; padding:26px 22px 22px; max-width:340px; width:100%;
  text-align:center; box-shadow:0 18px 50px rgba(0,0,0,.3); animation:lvlpop .45s cubic-bezier(.2,1.3,.5,1) both;}
.lvlup-emoji{font-size:58px; line-height:1; margin-bottom:6px;}
.lvlup-card h2{font-size:24px; margin:4px 0 8px; color:#1f3a6e;}
.lvlup-card p{font-size:15px; line-height:1.5; color:#4a5b78; margin:0 0 16px;}
.lvlup-card .btn-primary{width:100%;}
@keyframes lvlpop{0%{transform:scale(.6); opacity:0;} 100%{transform:scale(1); opacity:1;}}
@media (prefers-reduced-motion: reduce){ .lvlup-card{animation:none;} }
</style>
</head>
<body>
<div class="app">

  <!-- ========== STARTSEITE: Lernfeld wählen ========== -->
  <section id="screen-home" class="screen active">
    <div class="card center">
      <div style="font-size:46px;">✏️😊</div>
      <h1 id="greeting">Hallo!</h1>
      <p>Was möchtest du heute üben?</p>
      <input id="nameInput" type="text" maxlength="20" placeholder="Dein Name (freiwillig)" style="max-width:280px; margin:6px auto 0; text-align:center;">
      <p class="muted" style="font-size:13px; margin-top:6px;">Wird nur auf diesem Gerät gespeichert.</p>
    </div>
    <div class="card">
      <h2>Thema</h2>
      <p class="muted" style="margin-bottom:4px;">Gilt für alle Übungen mit Sätzen.</p>
      <div class="theme-grid" id="themeRow"></div>
    </div>

    <div class="card">
      <h2>Wähle ein Lernfeld</h2>
      <div class="level-row" id="levelRow">
        <button class="level-btn" data-level="3">Klasse 3</button>
        <button class="level-btn" data-level="4">Klasse 4</button>
        <button class="level-btn" data-level="0">Alle</button>
      </div>
      <div class="choice-grid" id="moduleChooser"></div>
    </div>
    <p style="text-align:center; margin:4px 0 12px;">
      <button class="linklike" id="adminLink">🔧 Elternbereich</button>
    </p>
  </section>

  <!-- ========== INHALTSBEREICH (füllt das aktive Modul) ========== -->
  <section id="screen-content" class="screen">
    <button class="back-btn" id="backBtn">← Zurück</button>
    <div id="moduleContent"></div>
  </section>

</div>

<!-- Druckbereich -->
<div id="printArea"></div>

<div id="levelUp" class="lvlup-overlay" aria-hidden="true" role="dialog" aria-modal="true">
  <canvas id="lvlupCanvas"></canvas>
  <div class="lvlup-card">
    <div class="lvlup-emoji" id="lvlupEmoji">🎉</div>
    <h2 id="lvlupTitle">Stufe freigeschaltet!</h2>
    <p id="lvlupText"></p>
    <button class="btn-primary" id="lvlupClose">Weiter geht's! 🚀</button>
  </div>
</div>

<!-- Untere Navigation (wird je Modul dynamisch aufgebaut) -->
<nav class="bottom-nav" id="bottomNav"></nav>

<script>
"use strict";
/* ============================================================
   LERN-APP – Modul-System („Lernfelder")
   Jedes Lernfeld ist ein eigenständiges Modul mit eigenen
   Bereichen (Reitern). Das Grundgerüst (Navigation, Blumentopf-
   Selbstcheck, Druck, Speichern) ist generisch.
   Neues Thema = neues Modul-Objekt in MODULES – sonst nichts.
   Reines HTML/CSS/JS, offline (PWA), Daten nur im localStorage.
   ============================================================ */

const $ = (id)=>document.getElementById(id);

// Globale Themen (gelten für alle Satz-Übungen). Neues Thema = hier + in jedem *_THEMEN ergänzen.
const THEMEN = [
  {id:"alltag",   name:"Alltag",  emoji:"🌳"},
  {id:"angeln",   name:"Angeln",  emoji:"🎣"},
  {id:"tennis",   name:"Tennis",  emoji:"🎾"},
  {id:"fussball", name:"Fußball", emoji:"⚽"}
];
function themaName(){ const t=THEMEN.find(x=>x.id===store.thema); return t?t.name:"Alltag"; }

/* Wählt die Sätze passend zur Klassenstufe:
   Klasse 3 -> Grundsätze (base), Klasse 4 -> schwerere Sätze (extra),
   Alle -> beide zusammen. Fällt zurück auf base, falls extra fehlt. */
function byLevel(base, extra){
  extra = extra || [];
  if(store.level===0) return base.concat(extra);
  if(store.level===4) return extra.length ? extra : base;
  return base; // Klasse 3
}
// Beschriftung der gewählten Klassenstufe (für Arbeitsblätter)
function klasseLabel(){ return store.level===3 ? "Klasse 3" : store.level===4 ? "Klasse 4" : "Klasse 3 & 4"; }

/* ============================================================
   GEMEINSAME BAUSTEINE
   ============================================================ */
const POT_LABELS = ["fängt an","wächst","stark","aufgeblüht"];

// Blumentopf-SVG in 4 Wachstumsstufen (Topf → Keim → Pflanze → Blüte)
function potSVG(stufe){
  const topf = `
    <path d="M16 46 h28 l-4 20 h-20 z" fill="#c47a4a"/>
    <rect x="13" y="41" width="34" height="7" rx="2.5" fill="#d98a58"/>
    <ellipse cx="30" cy="44.5" rx="15" ry="2.6" fill="#5e3f24"/>`;
  let p = "";
  if(stufe<=0){ p = ""; } // leerer Topf – noch nichts gelöst
  else if(stufe===1){ p = `<ellipse cx="30" cy="43" rx="2.4" ry="1.5" fill="#7a5230"/>`; }
  else if(stufe===2){ p = `
      <path d="M30 44 V33" stroke="#3f9d54" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="24.5" cy="35" rx="5" ry="3" fill="#5bb98c" transform="rotate(-25 24.5 35)"/>
      <ellipse cx="35.5" cy="34" rx="5" ry="3" fill="#5bb98c" transform="rotate(25 35.5 34)"/>`; }
  else if(stufe===3){ p = `
      <path d="M30 44 V24" stroke="#3f9d54" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="22.5" cy="34" rx="6" ry="3.4" fill="#5bb98c" transform="rotate(-28 22.5 34)"/>
      <ellipse cx="37.5" cy="32" rx="6" ry="3.4" fill="#5bb98c" transform="rotate(28 37.5 32)"/>
      <ellipse cx="24" cy="26" rx="5" ry="3" fill="#6ec79a" transform="rotate(-22 24 26)"/>`; }
  else{ p = `
      <path d="M30 44 V22" stroke="#3f9d54" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="22" cy="34" rx="6" ry="3.4" fill="#5bb98c" transform="rotate(-28 22 34)"/>
      <ellipse cx="38" cy="32" rx="6" ry="3.4" fill="#5bb98c" transform="rotate(28 38 32)"/>
      <g>
        <circle cx="30" cy="14" r="4.2" fill="#f5c451"/>
        <circle cx="30" cy="7.5" r="3.6" fill="#ef8fb3"/>
        <circle cx="36.5" cy="12" r="3.6" fill="#ef8fb3"/>
        <circle cx="34" cy="18.5" r="3.6" fill="#ef8fb3"/>
        <circle cx="26" cy="18.5" r="3.6" fill="#ef8fb3"/>
        <circle cx="23.5" cy="12" r="3.6" fill="#ef8fb3"/>
      </g>`; }
  return `<svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${p}${topf}</svg>`;
}

/* ============================================================
   BEWERTUNG je Übungs-Durchlauf (für alle Lernfelder)
   Zählt „auf Anhieb richtig" (first) und „insgesamt gelöst" (solved)
   und zeigt am Ende eine Auswertung mit Einwertung + „Nochmal üben".
   ============================================================ */
let scoreRuns = {};
function runGet(key, total){
  let r = scoreRuns[key];
  if(!r || r.total!==total){ r = scoreRuns[key] = {total:total, first:0, solved:0, scored:new Set(), wrong:new Set()}; }
  return r;
}
function runWrong(key, idx){ const r=scoreRuns[key]; if(r) r.wrong.add(idx); }
function runCorrect(key, idx){
  const r=scoreRuns[key]; if(!r || r.scored.has(idx)) return;
  r.scored.add(idx); r.solved++; if(!r.wrong.has(idx)) r.first++;
}
function runReset(key){ delete scoreRuns[key]; }

/* ============================================================
   STUFEN / LEVEL je Lernfeld
   Wer eine Runde komplett löst, schaltet die nächste (schwerere)
   Stufe frei. Die Fortschritte werden gespeichert (store.progress).
   Stufe 1 = Aufwärmen · 2 = Fortgeschritten · 3 = Profi.
   ============================================================ */
const MOD_FIELD = {subjekt:"subj",praedikat:"praed",satzglieder:"satzglied",rede:"rede",zeit:"zeit",grossklein:"gk",dassdas:"dd",wortarten:"wa",faelle:"faelle",doppel:"doppel"};
const LEVEL_NAME = {1:"Aufwärmen",2:"Fortgeschritten",3:"Profi"};
const FIELD_POOLS = {
  subj:()=>({easy:SUBJ_THEMEN[store.thema].saetze, hard:SUBJ_K4[store.thema]}),
  praed:()=>({easy:PRAED_THEMEN[store.thema].saetze, hard:PRAED_K4[store.thema]}),
  satzglied:()=>({easy:SATZGLIED_THEMEN[store.thema].saetze, hard:SATZGLIED_K4[store.thema]}),
  rede:()=>({easy:REDE_THEMEN[store.thema].saetze, hard:REDE_K4[store.thema]}),
  wa:()=>({easy:WA_THEMEN[store.thema].saetze, hard:WA_K4[store.thema]}),
  zeit:()=>{ const a=ZEIT_THEMEN[store.thema].saetze;
    return {easy:a.filter(s=>s.form==="praesens"||s.form==="praeteritum"),
            hard:a.filter(s=>s.form==="perfekt"||s.form==="futur")}; },
  gk:()=>({easy:GK_THEMEN[store.thema].saetze, hard:[]}),
  dd:()=>({easy:DD_THEMEN[store.thema].saetze, hard:[]}),
  faelle:()=>({easy:FAELLE_THEMEN[store.thema].saetze, hard:[]}),
  doppel:()=>({easy:DOPPEL_THEMEN[store.thema].woerter, hard:[]})
};
function fieldProg(key){ if(!store.progress[key]) store.progress[key]={unlocked:1,runs:0,crown:false}; return store.progress[key]; }
function fieldHard(key){ const h=FIELD_POOLS[key]().hard; return (h&&h.length)?h:null; }
function fieldMax(key){ return fieldHard(key)?3:2; }
// Klasse 4 startet schwerer – außer beim Grundwortschatz (Wörter sind stufenneutral)
function fieldStart(key){ return (store.level===4 && !key.startsWith("gws:") && fieldHard(key)) ? 2 : 1; }
/* Stufen-Steuerung (Elternbereich): eine feste Stufe kann global, je
   Klassenstufe oder je Bereich aktiviert werden. Vorrang:
   Bereich > Klassenstufe > Global > Automatisch (erspielt). */
function fieldOverride(key){
  const o=store.stufen||{};
  const f=(o.felder||{})[key]; if(f>=1) return f;
  const kl=(o.klasse||{})[String(store.level)]; if(kl>=1) return kl;
  if(o.global>=1) return o.global;
  return 0;
}
function fieldOverridden(key){ return fieldOverride(key)>=1; }
function fieldLevel(key){
  const max=fieldMax(key);
  const ovr=fieldOverride(key);
  if(ovr>=1) return Math.min(max, ovr);
  const p=fieldProg(key);
  return Math.min(max, Math.max(fieldStart(key), p.unlocked||1));
}
function fieldPool(key){
  const {easy,hard}=FIELD_POOLS[key](); const lvl=fieldLevel(key);
  if(lvl>=3) return easy.concat(hard||[]);
  if(lvl===2) return (hard&&hard.length)?hard:easy;
  return easy;
}
function fieldBadge(key){
  const lvl=fieldLevel(key), max=fieldMax(key), p=fieldProg(key);
  return `<span class="lvl-badge">🎯 Aktive Stufe ${lvl}/${max} · ${LEVEL_NAME[lvl]}${fieldOverridden(key)?" 📌":""}${p.crown?" 👑":""}</span>`;
}

// Auswertung + Einwertung (ohne Note), generisch. onRepeat startet die Runde neu.
function renderRunResult(host, key, onRepeat){
  const r = scoreRuns[key] || {total:0, first:0, solved:0};
  const total=r.total, first=r.first, solved=r.solved;
  // Einwertung nach dem, was das Kind wirklich gelöst hat (nicht nur „auf Anhieb").
  const ratio = total>0 ? solved/total : 0;
  const allFirst = solved===total && first===total && total>0;
  let stufe, titel, text;
  if(solved===0){ stufe=0; titel="Guter Anfang! 🌰"; text="Hier war noch keine Lösung dabei – probiere die Runde ruhig noch einmal."; }
  else if(allFirst){ stufe=4; titel="Aufgeblüht! 🌸"; text="Perfekt – alles auf Anhieb richtig gelöst!"; }
  else if(ratio>=0.85){ stufe=4; titel="Aufgeblüht! 🌸"; text="Klasse gemacht – fast alles gelöst!"; }
  else if(ratio>=0.6){ stufe=3; titel="Stark! 🌼"; text="Sehr gut – vieles hast du gelöst."; }
  else if(ratio>=0.35){ stufe=2; titel="Du wächst! 🌿"; text="Guter Weg – mit ein bisschen Übung wird es sicherer."; }
  else { stufe=1; titel="Es keimt! 🌱"; text="Ein Anfang ist gemacht – übe die Runde ruhig noch einmal."; }

  // ---- Stufen-Fortschritt: einmal je abgeschlossener Runde auswerten ----
  let unlockedTo=null, newCrown=false, levelLine="";
  const isField = !!FIELD_POOLS[key];
  if(isField){
    const p=fieldProg(key), lvl=fieldLevel(key), maxL=fieldMax(key);
    const ovr=fieldOverridden(key);
    const mastered = total>0 && solved===total;
    if(!r.done){
      r.done=true; p.runs=(p.runs||0)+1;
      if(mastered && lvl<maxL){ p.unlocked=Math.max(p.unlocked||1, lvl+1); if(!ovr) unlockedTo=lvl+1; }
      else if(mastered && lvl>=maxL && first===total && !p.crown){ p.crown=true; newCrown=true; }
      save();
    }
    // Motivations-Zeile
    if(unlockedTo){ levelLine=`<div class="lvl-note up">🎉 <b>Stufe ${unlockedTo} freigeschaltet:</b> „${LEVEL_NAME[unlockedTo]}“!</div>`; }
    else if(newCrown || (lvl>=maxL && p.crown)){ levelLine=`<div class="lvl-note crown">👑 <b>Profi-Stufe gemeistert!</b> Alles beim ersten Versuch.</div>`; }
    else if(ovr){ levelLine=`<div class="lvl-note">📌 Stufe ${lvl} (${LEVEL_NAME[lvl]}) ist im <b>Elternbereich festgelegt</b>.</div>`; }
    else if(lvl<maxL){ levelLine=`<div class="lvl-note">🎯 Löse <b>alle Aufgaben</b>, um <b>Stufe ${lvl+1} (${LEVEL_NAME[lvl+1]})</b> freizuschalten.</div>`; }
    else { levelLine=`<div class="lvl-note">👑 Löse <b>alles beim ersten Versuch</b> für die Profi-Krone!</div>`; }
  }

  host.innerHTML = `
    <div class="card">
      <h3 style="text-align:center;margin:4px 0;">Deine Auswertung</h3>
      ${isField?`<p style="text-align:center;margin:0 0 4px;">${fieldBadge(key)}</p>`:``}
      <div style="text-align:center;margin:6px 0;">${potSVG(stufe)}</div>
      <p style="text-align:center;font-size:20px;font-weight:800;margin:2px 0;">${titel}</p>
      <p style="text-align:center;" class="muted">${text}</p>
      <div class="example-box" style="margin-top:10px;">
        🌟 <b>Auf Anhieb richtig:</b> ${first} von ${total}<br>
        ✅ <b>Insgesamt gelöst:</b> ${solved} von ${total}
      </div>
      ${levelLine}
      <div style="display:flex; gap:10px; margin-top:12px;">
        <button class="btn-primary btn-small" id="runAgain" style="flex:1;">🔁 Nochmal üben</button>
        <button class="btn-green btn-small" id="runBlume" style="flex:1;">🌱 Meine Blume</button>
      </div>
      <button class="btn-secondary btn-small mt" id="runBack" style="width:100%;">← Zurück zur Startseite</button>
    </div>`;
  host.querySelector("#runAgain").onclick=()=>{ runReset(key); onRepeat(); window.scrollTo(0,0); };
  host.querySelector("#runBlume").onclick=()=>goSection("blume");
  host.querySelector("#runBack").onclick=goHome;
  if(unlockedTo) setTimeout(()=>celebrateLevelUp(unlockedTo), 260);
  else if(newCrown) setTimeout(()=>celebrateCrown(), 260);
}

/* ---- Level-Up Feier + Konfetti (Canvas) ---- */
let _confettiRAF=null;
function startConfetti(){
  const cv=$("lvlupCanvas"); if(!cv) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ctx=cv.getContext("2d"); if(!ctx) return;
  const w=cv.width=cv.offsetWidth||window.innerWidth, h=cv.height=cv.offsetHeight||window.innerHeight;
  const colors=["#4a7fd6","#f5c451","#ef8fb3","#5bb98c","#f0872f"];
  const N=reduce?0:130; const parts=[];
  for(let i=0;i<N;i++){ parts.push({x:Math.random()*w, y:-20-Math.random()*h*0.5,
    r:5+Math.random()*7, c:colors[i%colors.length], vy:2+Math.random()*3.5, vx:-1.6+Math.random()*3.2,
    rot:Math.random()*6.28, vr:-0.2+Math.random()*0.4}); }
  let t=0;
  function frame(){
    ctx.clearRect(0,0,w,h);
    parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vy+=0.035;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.62); ctx.restore(); });
    t++;
    if(t<260 && parts.some(p=>p.y<h+40)){ _confettiRAF=requestAnimationFrame(frame); }
    else { ctx.clearRect(0,0,w,h); _confettiRAF=null; }
  }
  if(N) frame();
}
function stopConfetti(){ if(_confettiRAF){ cancelAnimationFrame(_confettiRAF); _confettiRAF=null; }
  const cv=$("lvlupCanvas"); if(cv){ const c=cv.getContext("2d"); if(c) c.clearRect(0,0,cv.width,cv.height); } }
function showLevelUp(){ const ov=$("levelUp"); ov.classList.add("show"); ov.setAttribute("aria-hidden","false"); startConfetti(); }
function hideLevelUp(){ const ov=$("levelUp"); ov.classList.remove("show"); ov.setAttribute("aria-hidden","true"); stopConfetti(); }
function celebrateLevelUp(newLevel){
  $("lvlupEmoji").textContent="🎉";
  $("lvlupTitle").textContent="Stufe "+newLevel+" freigeschaltet!";
  $("lvlupText").innerHTML="Stark! Du kommst jetzt in <b>„"+(LEVEL_NAME[newLevel]||"")+"“</b> – neue, schwerere Aufgaben warten auf dich.";
  showLevelUp();
}
function celebrateCrown(){
  $("lvlupEmoji").textContent="👑";
  $("lvlupTitle").textContent="Profi gemeistert!";
  $("lvlupText").innerHTML="Wow! Du hast <b>alles beim ersten Versuch</b> richtig gelöst. Du bist ein echter Profi! 🌟";
  showLevelUp();
}

// Generischer Blumentopf-Selbstcheck: cfg = {groups:[{title,fragen:[]}], form:[]}
//                                      st  = {groups:[[..]], form:[..]}
function renderFlower(c, cfg, st){
  c.innerHTML = `
    <div class="card"><h2>🌱 Meine Blume</h2>
      <p>Schätze selbst ein – so wie deine Lehrerin es auch macht. Tippe pro Zeile den Topf an,
      der am besten passt. <b>Es gibt keine Noten</b> – deine Blume wächst mit jedem Schritt! 🌷</p></div>
    <div class="card" id="flowerGroups"></div>
    <div class="card"><h3>Form &amp; Schrift <span class="muted">(ohne Bewertung)</span></h3>
      <p class="muted">Nur zum Abhaken.</p><ul class="checklist" id="flowerForm"></ul></div>
    <div class="card"><h3>Deine Blume</h3>
      <div class="bloom"><div id="bloomIcon"></div><div class="txt" id="bloomText"></div></div>
      <button class="btn-quiet mt" id="flowerReset" style="width:100%;">Neu einschätzen</button></div>`;
  const gc = c.querySelector("#flowerGroups");
  cfg.groups.forEach((g,gi)=>{
    const h=document.createElement("h3"); h.textContent=g.title; h.style.marginTop = gi ? "16px":"0"; gc.appendChild(h);
    g.fragen.forEach((frage,i)=>{
      const crit=document.createElement("div"); crit.className="crit";
      crit.innerHTML=`<div class="frage">${frage}</div>`;
      const row=document.createElement("div"); row.className="pot-row"; const pots=[];
      for(let stufe=1; stufe<=4; stufe++){
        const b=document.createElement("button");
        b.className="pot"+(st.groups[gi][i]===stufe?" selected":"");
        b.innerHTML=potSVG(stufe)+`<span class="plabel">${POT_LABELS[stufe-1]}</span>`;
        b.onclick=()=>{ st.groups[gi][i]=stufe; save();
          pots.forEach((pp,idx)=>pp.classList.toggle("selected", idx+1===stufe)); updateBloom(c,st); };
        pots.push(b); row.appendChild(b);
      }
      crit.appendChild(row); gc.appendChild(crit);
    });
  });
  const fl=c.querySelector("#flowerForm");
  cfg.form.forEach((t,i)=>{
    const li=document.createElement("li");
    li.innerHTML=`<input type="checkbox" ${st.form[i]?"checked":""}> <span>${t}</span>`;
    li.querySelector("input").onchange=e=>{ st.form[i]=e.target.checked; save(); };
    li.onclick=e=>{ if(e.target.tagName!=="INPUT"){ const b=li.querySelector("input"); b.checked=!b.checked; st.form[i]=b.checked; save(); } };
    fl.appendChild(li);
  });
  c.querySelector("#flowerReset").onclick=()=>{
    if(confirm("Einschätzung zurücksetzen?")){ st.groups.forEach(a=>a.fill(0)); st.form.fill(false); save(); renderFlower(c,cfg,st); }
  };
  updateBloom(c,st);
}
function updateBloom(c, st){
  const all=[].concat(...st.groups).filter(v=>v>0);
  const icon=c.querySelector("#bloomIcon"), txt=c.querySelector("#bloomText");
  if(!all.length){ icon.innerHTML=potSVG(1); txt.textContent="Tippe oben die Töpfe an, dann wächst deine Blume."; return; }
  const avg=all.reduce((a,b)=>a+b,0)/all.length;
  const stufe=Math.max(1,Math.min(4,Math.round(avg)));
  icon.innerHTML=potSVG(stufe);
  txt.textContent={
    1:"🌱 Dein Pflänzchen fängt an zu wachsen. Toll, dass du geübt hast!",
    2:"🌿 Deine Pflanze wächst schön. Weiter so!",
    3:"🌷 Deine Blume wird richtig stark! Super gemacht.",
    4:"🌸 Wow, deine Blume ist voll aufgeblüht! Klasse Arbeit."
  }[stufe];
}

function vgSolution(c){
  const r=REZEPTE[store.vorgang.rezept];
  c.innerHTML = `
    <div class="card"><h2>🔑 Lösung</h2>
      <p>Die Lösung zeigt dir, wie ein guter Text aussehen kann. Aber <b>erst selbst versuchen!</b> 💪</p></div>
    <div class="card" id="gateCard">
      <h3>Erst selbst probieren</h3>
      <p class="muted"><b>1)</b> Hast du es selbst versucht? Tippe nach jedem Versuch:</p>
      <button class="btn-secondary btn-small" id="tryBtn">Ich habe es versucht</button>
      <div class="gate-count">Versuche: <b><span id="tryCount">${vgTries}</span> / 3</b></div>
      <p class="muted mt"><b>2)</b> Welche Schritte hast du schon auf dein Blatt geschrieben?</p>
      <ul class="checklist" id="writtenList"></ul>
      <div class="hint" id="gateStatus"></div>
      <button class="btn-primary btn-locked" id="showSolutionBtn" disabled>🔒 Lösung anzeigen</button></div>
    <div class="card" id="solutionCard" style="display:none;">
      <h3>So kann ein guter Text aussehen</h3>
      <div id="solutionText" class="final-solution"></div>
      <button class="btn-green mt" id="printSolutionBtn" style="width:100%;">Lösung drucken</button>
      <button class="btn-quiet" id="resetSolutionBtn" style="width:100%;">Neu versuchen</button></div>`;
  const ul=c.querySelector("#writtenList");
  for(let i=0;i<5;i++){
    const li=document.createElement("li");
    li.innerHTML=`<input type="checkbox" ${vgWritten[i]?"checked":""}> <span>Schritt ${i+1} geschrieben</span>`;
    li.querySelector("input").onchange=e=>{ vgWritten[i]=e.target.checked; vgGate(c); };
    li.onclick=e=>{ if(e.target.tagName!=="INPUT"){ const b=li.querySelector("input"); b.checked=!b.checked; vgWritten[i]=b.checked; vgGate(c); } };
    ul.appendChild(li);
  }
  c.querySelector("#tryBtn").onclick=()=>{ if(vgTries<3)vgTries++; c.querySelector("#tryCount").textContent=vgTries; vgGate(c); };
  c.querySelector("#showSolutionBtn").onclick=()=>{
    if(c.querySelector("#showSolutionBtn").disabled) return;
    c.querySelector("#solutionText").innerHTML=vgSolutionInner(r);
    c.querySelector("#solutionCard").style.display="block";
    c.querySelector("#solutionCard").scrollIntoView({behavior:"smooth"});
  };
  c.querySelector("#printSolutionBtn").onclick=()=>printHTML(vgSolutionInner(r));
  c.querySelector("#resetSolutionBtn").onclick=()=>{ vgTries=0; vgWritten=[false,false,false,false,false]; vgSolution(c); };
  vgGate(c);
}
function vgGate(c){
  const writtenCount=vgWritten.filter(Boolean).length;
  const ok = vgTries>=3 && writtenCount>=3;
  const btn=c.querySelector("#showSolutionBtn");
  btn.disabled=!ok; btn.classList.toggle("btn-locked",!ok);
  btn.textContent = ok ? "Lösung anzeigen" : "🔒 Lösung anzeigen";
  const status=c.querySelector("#gateStatus");
  if(ok){ status.textContent="Super, du hast fleißig geübt! Jetzt darfst du die Lösung ansehen. 🌟"; }
  else{
    const teile=[];
    if(vgTries<3) teile.push("noch "+(3-vgTries)+"× „Ich habe es versucht“");
    if(writtenCount<3) teile.push("mindestens "+Math.max(0,3-writtenCount)+" Schritt(e) mehr abhaken");
    status.textContent="Fast! Du brauchst noch: "+teile.join(" und ")+".";
  }
}
function vgSolutionInner(r){
  return `<div class="ws-head"><span class="pen">✏️</span><h2>${r.titel}</h2></div>

    <ol class="sol-list">${r.loesung.map(s=>`<li>${s}</li>`).join("")}</ol>`;
}

// --- Bereich „Üben" (Wörter antippen) ---
function sjUeben(c){
  const S=subjSaetze();
  runGet("subj", S.length);
  if(subjIdx>=S.length){ return renderRunResult(c, "subj", ()=>{ subjIdx=0; sjUeben(c); }); }
  const s=S[subjIdx];
  const selected=new Set();
  c.innerHTML = `
    <div class="card">
      <h2>✏️ Subjekt finden</h2>
      <p class="muted">Satz ${subjIdx+1} von ${S.length}</p>
      <div class="lvl-row">${fieldBadge("subj")}</div>
      <div class="hint">Frage: <b>${s.frage}</b></div>
      <p>Tippe das <b>Subjekt</b> an (ein oder mehrere Wörter):</p>
      <div class="sentence-box" id="sbox"></div>
      <div id="sfb"></div>
      <div style="display:flex; gap:10px; margin-top:12px;">
        <button class="btn-secondary btn-small" id="checkBtn" style="flex:1;">Prüfen</button>
        <button class="btn-primary btn-small" id="nextBtn" style="flex:1;">Nächster Satz</button>
      </div>
    </div>`;
  const box=c.querySelector("#sbox");
  s.woerter.forEach((w,i)=>{
    const sp=document.createElement("span");
    sp.className="word"; sp.textContent=w;
    sp.onclick=()=>{ if(selected.has(i)){ selected.delete(i); sp.classList.remove("sel"); }
      else { selected.add(i); sp.classList.add("sel"); } c.querySelector("#sfb").innerHTML=""; };
    box.appendChild(sp); box.appendChild(document.createTextNode(" "));
  });
  c.querySelector("#checkBtn").onclick=()=>{
    const chosen=[...selected].sort((a,b)=>a-b);
    const correct = chosen.length===s.subj.length && chosen.every((v,k)=>v===s.subj[k]);
    if(correct) runCorrect("subj", subjIdx); else runWrong("subj", subjIdx);
    const d=document.createElement("div");
    d.className="feedback "+(correct?"ok":"tip");
    d.textContent = correct ? "Richtig! Das ist das Subjekt. 🌟"
                            : "Fast! Frag dich noch einmal „"+s.frage+"“ und tippe nur das Subjekt an.";
    const fb=c.querySelector("#sfb"); fb.innerHTML=""; fb.appendChild(d);
    focusFeedback(d, correct?null:c.querySelector("#nextBtn"));
  };
  c.querySelector("#nextBtn").onclick=()=>{
    if(!selected.size){ needAnswer(c.querySelector("#sfb"), "Tippe zuerst das Subjekt an – dann geht es weiter."); return; }
    const ch=[...selected].sort((a,b)=>a-b);
    const ok=ch.length===s.subj.length && ch.every((v,k)=>v===s.subj[k]);
    if(ok) runCorrect("subj", subjIdx); else runWrong("subj", subjIdx);
    subjIdx=subjIdx+1; sjUeben(c); window.scrollTo(0,0);
  };
}

// --- Bereich „Frage" (Wer? oder Was?) ---
function sjFrage(c){
  const S=subjSaetze();
  if(frageIdx>=S.length) frageIdx=0;
  const s=S[frageIdx];
  c.innerHTML = `
    <div class="card">
      <h2>❓ Wer oder Was?</h2>
      <p class="muted">Satz ${frageIdx+1} von ${S.length}</p>
      <div class="lvl-row">${fieldBadge("subj")}</div>
      <div class="sentence-box">${s.woerter.join(" ")}</div>
      <p>Das Subjekt ist <b>${s.subjektText}</b>.<br>Fragst du danach mit <b>Wer</b> oder mit <b>Was</b>?</p>
      <div style="display:flex; gap:10px;">
        <button class="btn-secondary" id="werBtn" style="flex:1; font-size:22px;">Wer?</button>
        <button class="btn-secondary" id="wasBtn" style="flex:1; font-size:22px;">Was?</button>
      </div>
      <div id="ffb"></div>
      <button class="btn-primary mt" id="nextF">Nächster Satz</button>
    </div>`;
  const check=(art)=>{
    const correct = art===s.art;
    const d=document.createElement("div");
    d.className="feedback "+(correct?"ok":"tip");
    if(correct){
      d.textContent = (s.art==="wer")
        ? "Richtig! „"+s.subjektText+"“ ist eine Person → Wer? 🌟"
        : "Richtig! „"+s.subjektText+"“ ist ein Ding oder Tier → Was? 🌟";
    }else{
      d.textContent = "Fast! Überlege: Ist „"+s.subjektText+"“ eine Person (Wer?) oder ein Ding/Tier (Was?)?";
    }
    const fb=c.querySelector("#ffb"); fb.innerHTML=""; fb.appendChild(d);
  };
  c.querySelector("#werBtn").onclick=()=>check("wer");
  c.querySelector("#wasBtn").onclick=()=>check("was");
  c.querySelector("#nextF").onclick=()=>{ frageIdx=(frageIdx+1)%S.length; sjFrage(c); window.scrollTo(0,0); };
}

function pjUeben(c){
  const S=praedSaetze();
  runGet("praed", S.length);
  if(praedIdx>=S.length){ return renderRunResult(c, "praed", ()=>{ praedIdx=0; pjUeben(c); }); }
  const s=S[praedIdx];
  const selected=new Set();
  const zweiteilig = s.praed.length>1;
  c.innerHTML = `
    <div class="card">
      <h2>✏️ Prädikat finden</h2>

      </div>
    </div>`;
  const box=c.querySelector("#pbox");
  s.woerter.forEach((w,i)=>{
    const sp=document.createElement("span");
    sp.className="word"; sp.textContent=w;
    sp.onclick=()=>{ if(selected.has(i)){ selected.delete(i); sp.classList.remove("selp"); }
      else { selected.add(i); sp.classList.add("selp"); } c.querySelector("#pfb").innerHTML=""; };
    box.appendChild(sp); box.appendChild(document.createTextNode(" "));
  });
  c.querySelector("#checkBtn").onclick=()=>{
    const chosen=[...selected].sort((a,b)=>a-b);
    const correct = chosen.length===s.praed.length && chosen.every((v,k)=>v===s.praed[k]);
    if(correct) runCorrect("praed", praedIdx); else runWrong("praed", praedIdx);
    const d=document.createElement("div"); d.className="feedback "+(correct?"ok":"tip");
    d.textContent = correct ? "Richtig! Das ist das Prädikat (Tun-Wort). 🌟"
                            : "Fast! Das Prädikat sagt, was passiert. Frag dich: Was tut das Subjekt?";
    const fb=c.querySelector("#pfb"); fb.innerHTML=""; fb.appendChild(d);
    focusFeedback(d, correct?null:c.querySelector("#nextBtn"));
  };
  c.querySelector("#nextBtn").onclick=()=>{
    if(!selected.size){ needAnswer(c.querySelector("#pfb"), "Tippe zuerst das Prädikat an – dann geht es weiter."); return; }
    const ch=[...selected].sort((a,b)=>a-b);
    const ok=ch.length===s.praed.length && ch.every((v,k)=>v===s.praed[k]);
    if(ok) runCorrect("praed", praedIdx); else runWrong("praed", praedIdx);
    praedIdx=praedIdx+1; pjUeben(c); window.scrollTo(0,0);
  };
}

  const s=S[redeIdx];
  const selected=new Set();
  c.innerHTML=`

      <p class="muted">Satz ${redeIdx+1} von ${S.length}</p>

      </div>
    </div>`;
  const box=c.querySelector("#rbox");
  s.woerter.forEach((w,i)=>{
    const sp=document.createElement("span"); sp.className="word"; sp.textContent=w;
    sp.onclick=()=>{ if(selected.has(i)){selected.delete(i);sp.classList.remove("selr");} else {selected.add(i);sp.classList.add("selr");} c.querySelector("#rfb").innerHTML=""; };

    if(!selected.size){ needAnswer(c.querySelector("#rfb"), "Tippe zuerst die wörtliche Rede an – dann geht es weiter."); return; }

// Quiz-Engine mit sofortigem Feedback + Begründung + Auswertung am Ende.
// state hält den Punktestand über alle Aufgaben (res[i] = "first"/"later"/"wrong"/"open").
function renderQuizPaged(host, items, getIdx, setIdx, state){
  if(!state){ state={res:[]}; }
  let i=getIdx();
  if(i>=items.length){ return renderQuizResult(host, items, getIdx, setIdx, state); }
  const it=items[i];
  let answered=false, wrongTries=0;
  host.innerHTML = `
    <p class="muted">Aufgabe ${i+1} von ${items.length}</p>
    <p style="font-size:19px;"><b>${it.frage}</b></p>
    <div id="opts"></div>
    <div id="qfb"></div>
    <button class="btn-primary btn-small mt" id="qnext" style="width:100%;">Weiter</button>`;
  const fb=host.querySelector("#qfb");
  const opts=host.querySelector("#opts");
  if(it.typ==="reveal"){
    answered=true; state.res[i]="open"; // offene Frage: selbst prüfen, „Weiter“ immer erlaubt
    const rev=document.createElement("button");
    rev.className="btn-secondary btn-small"; rev.style.width="100%"; rev.textContent="Lösung zeigen";
    rev.onclick=()=>{ fb.innerHTML=""; const d=document.createElement("div"); d.className="feedback ok";
      d.textContent="Mögliche Lösung: "+it.loesung; fb.appendChild(d); };
    opts.appendChild(rev);
  } else {
    it.optionen.forEach((o,oi)=>{
      const b=document.createElement("button"); b.className="quiz-opt"; b.textContent=o;
      b.onclick=()=>{
        if(answered) return; // nach einer gültigen Antwort nicht mehr weiterzählen
        const correct = oi===it.loesung;
        const d=document.createElement("div");
        if(correct){
          answered=true; b.classList.add("ok");
          state.res[i] = wrongTries===0 ? "first" : "later";
          d.className="feedback ok"; d.textContent="Richtig! 🌟 "+(it.erkl||"");
        }else{
          wrongTries++; b.classList.add("no");
          d.className="feedback tip";
          if(wrongTries>=2){
            answered=true; state.res[i]="wrong";
            d.innerHTML="Das war noch nicht richtig. Die richtige Antwort ist <b>"+it.optionen[it.loesung]+"</b>.<br>"+(it.erkl||"");
            [...opts.children].forEach((bb,bi)=>{ if(bi===it.loesung) bb.classList.add("ok"); });
          }else{
            d.textContent="Das stimmt noch nicht. 💡 "+(it.tipp||"Überlege noch einmal.");
          }
        }
        fb.innerHTML=""; fb.appendChild(d);
        if(!correct) focusFeedback(d, host.querySelector("#qnext"));
      };
      opts.appendChild(b);
    });
  }
  host.querySelector("#qnext").onclick=()=>{
    if(!answered){
      fb.innerHTML=""; const d=document.createElement("div"); d.className="feedback tip";
      d.textContent="Wähle zuerst eine Antwort – dann siehst du, ob sie richtig war.";
      fb.appendChild(d); return;
    }
    setIdx(i+1);
    renderQuizPaged(host, items, getIdx, setIdx, state);
    window.scrollTo(0,0);
  };
}
// Auswertung + Einwertung am Ende einer Übungsreihe, mit „Nochmal üben".
function renderQuizResult(host, items, getIdx, setIdx, state){
  const mc = items.filter(x=>x.typ!=="reveal").length;
  const open = items.length - mc;
  let first=0, later=0, wrong=0;
  for(let k=0;k<items.length;k++){
    if(state.res[k]==="first") first++;
    else if(state.res[k]==="later") later++;
    else if(state.res[k]==="wrong") wrong++;
  }
  const geschafft = first+later;            // insgesamt richtig gelöst
  const ratio = mc>0 ? geschafft/mc : 0;    // Einwertung nach dem, was gelöst wurde
  const allFirst = geschafft===mc && first===mc && mc>0;
  let stufe, titel, text;
  if(geschafft===0){ stufe=0; titel="Guter Anfang! 🌰"; text="Hier war noch keine Lösung dabei – probiere die Aufgaben ruhig noch einmal."; }
  else if(allFirst){ stufe=4; titel="Aufgeblüht! 🌸"; text="Perfekt – alles auf Anhieb richtig gelöst!"; }
  else if(ratio>=0.85){ stufe=4; titel="Aufgeblüht! 🌸"; text="Klasse gemacht – fast alles gelöst!"; }
  else if(ratio>=0.6){ stufe=3; titel="Stark! 🌼"; text="Sehr gut – vieles hast du gelöst."; }
  else if(ratio>=0.35){ stufe=2; titel="Du wächst! 🌿"; text="Guter Weg – mit ein bisschen Übung wird es sicherer."; }
  else { stufe=1; titel="Es keimt! 🌱"; text="Ein Anfang ist gemacht – wiederhole die Aufgaben ruhig noch einmal."; }
  host.innerHTML = `
    <h3 style="text-align:center;margin:4px 0;">Deine Auswertung</h3>
    <div style="text-align:center;margin:6px 0;">${potSVG(stufe)}</div>
    <p style="text-align:center;font-size:20px;font-weight:800;margin:2px 0;">${titel}</p>
    <p style="text-align:center;" class="muted">${text}</p>
    <div class="example-box" style="margin-top:10px;">
      🌟 <b>Auf Anhieb richtig:</b> ${first} von ${mc}<br>
      ✅ <b>Insgesamt gelöst:</b> ${geschafft} von ${mc}${later?` (davon ${later} nach einem Tipp)`:``}<br>
      ${wrong?`🔁 <b>Nochmal anschauen:</b> ${wrong}<br>`:``}
      ${open?`📝 <b>Offene Fragen zum Selbst-Prüfen:</b> ${open}`:``}
    </div>
    <button class="btn-primary mt" id="qagain" style="width:100%;">🔁 Nochmal üben</button>
    <button class="btn-secondary btn-small mt" id="qback" style="width:100%;">← Zurück zur Startseite</button>`;
  host.querySelector("#qagain").onclick=()=>{
    setIdx(0);
    renderQuizPaged(host, items, getIdx, setIdx, {res:[]});
    window.scrollTo(0,0);
  };
  host.querySelector("#qback").onclick=goHome;
}

// Effektive Wortlisten: eigene Wörter aus dem Elternbereich (store.gwsWords)
// haben Vorrang vor der eingebauten amtlichen Liste.
function gwsLists(k){
  const o = store.gwsWords && store.gwsWords[k.id];
  if(o) return {leicht:o.leicht||[], schwer:o.schwer||[]};
  return {leicht:k.leicht||[], schwer:k.schwer||[]};
}
// Stufen je Regel-Gruppe: Stufe 1 = leichte Wörter (Klasse 1/2), Stufe 2 = schwere (Klasse 3/4),
// Stufe 3 = alle gemischt. Hat eine Gruppe nur einen Teil, wird hälftig gesteigert.
GWS_KATEGORIEN.forEach(k=>{
  FIELD_POOLS["gws:"+k.id]=()=>{
    const eff=gwsLists(k), L=eff.leicht, S=eff.schwer;
    if(L.length>=4 && S.length) return {easy:L, hard:S};
    const all=L.concat(S), half=Math.ceil(all.length/2);
    return {easy:all.slice(0,half), hard:all.slice(half)};
  };
});

function gwsInfo(c){
  const total = GWS_KATEGORIEN.reduce((a,k)=>{ const e=gwsLists(k); return a+e.leicht.length+e.schwer.length; },0);
  const rows = GWS_KATEGORIEN.map(k=>{
    const e=gwsLists(k); const all=e.leicht.concat(e.schwer);
    return `<div class="example-box" style="margin-bottom:8px;"><b>${k.emoji} ${k.name}</b><br>${k.regel}<br>
      <span class="muted">Beispiele: ${all.slice(0,4).map(w=>w.richtig).join(", ")}</span></div>`;
  }).join("");
  c.innerHTML=`
    <div class="card"><h2>📚 Grundwortschatz üben</h2>
      <p>Hier übst du <b>${total} Wörter</b> aus dem <b>amtlichen Grundwortschatz</b> für
      Baden-Württemberg (Kultusministerium, 2020) – geordnet nach Regeln.</p>
      <p class="muted">Jede Gruppe hat Stufen: Erst kommen die <b>leichten</b> Wörter (Klasse 1/2),
      dann die <b>schweren</b> (Klasse 3/4), zum Schluss <b>alle</b>.</p></div>
    <div class="card"><h3>Die Regel-Gruppen</h3>${rows}</div>
    <div class="card"><div class="hint">💡 Zwei Zauber-Strategien: <b>Verlängern</b> (Hund → Hunde) und <b>Ableiten</b> (Bäcker ← backen).</div>

  c.querySelector("#toUeben").onclick=()=>goSection("ueben");
}
// Runden bleiben kurz: große Wort-Pools werden in Pakete à 10 geteilt,
// die von Runde zu Runde durchwechseln (nach Anzahl der Durchläufe).
function gwsChunk(key){
  const full=fieldPool(key), CH=10;
  const n=Math.max(1, Math.ceil(full.length/CH));
  const ci=(fieldProg(key).runs||0)%n;
  return {S:full.slice(ci*CH, ci*CH+CH), ci:ci, n:n};
}
function gwsUeben(c){
  if(gwsCatIdx>=GWS_KATEGORIEN.length) gwsCatIdx=0;
  const K=GWS_KATEGORIEN[gwsCatIdx];
  const key="gws:"+K.id;
  if(gwsIdx>=gwsChunk(key).S.length) gwsIdx=0;
  const chooser = GWS_KATEGORIEN.map((k,ki)=>
    `<button class="chip${ki===gwsCatIdx?" on":""}" data-ki="${ki}">${k.emoji} ${k.name}</button>`).join("");
  c.innerHTML=`
    <div class="card"><h2>📚 Grundwortschatz</h2>
      <p class="muted">Wähle eine Regel-Gruppe. Welches Wort ist richtig geschrieben?</p>
      <div class="chip-row">${chooser}</div></div>
    <div class="card"><h3>${K.emoji} ${K.name}</h3>
      <div class="lvl-row">${fieldBadge(key)}</div>
      <div class="hint">${K.regel}</div>
      <div id="gwsHost"></div></div>`;
  c.querySelectorAll(".chip[data-ki]").forEach(b=>b.onclick=()=>{ gwsCatIdx=+b.dataset.ki; gwsIdx=0; gwsUeben(c); });
  renderSpellPaged(c.querySelector("#gwsHost"), K, key);
}
// Paged „richtige Schreibung wählen" mit Bewertung + Stufen am Ende
function renderSpellPaged(host, K, key){
  const ch=gwsChunk(key), S=ch.S;
  runGet(key, S.length);
  if(gwsIdx>=S.length){ return renderRunResult(host, key, ()=>{ gwsIdx=0; goSection("ueben"); }); }
  const i=gwsIdx, w=S[i];
  const richtigLinks = i%2===0;
  const a = richtigLinks?w.richtig:w.falsch;
  const b = richtigLinks?w.falsch:w.richtig;
  let answered=false;
  host.innerHTML=`
    <p class="muted">Wort ${i+1} von ${S.length}${ch.n>1?` · Paket ${ch.ci+1} von ${ch.n}`:``}</p>
    <p>Welches Wort ist <b>richtig</b> geschrieben?</p>
    <div style="display:flex; gap:10px;">
      <button class="btn-secondary gws-opt" data-w="${a}" style="flex:1; font-size:22px;">${a}</button>
      <button class="btn-secondary gws-opt" data-w="${b}" style="flex:1; font-size:22px;">${b}</button>
    </div>
    <div id="gwsfb"></div>
    <button class="btn-primary btn-small mt" id="gwsNext" style="width:100%;">Weiter</button>`;
  const fb=host.querySelector("#gwsfb");
  host.querySelectorAll(".gws-opt").forEach(btn=>btn.onclick=()=>{
    if(answered) return;
    const correct = btn.dataset.w===w.richtig; answered=true;
    if(correct) runCorrect(key,i); else runWrong(key,i);
    const d=document.createElement("div"); d.className="feedback "+(correct?"ok":"tip");
    d.innerHTML = correct ? ("Richtig! 🌟 So schreibt man „<b>"+w.richtig+"</b>“. "+K.tipp)
                          : ("Fast! Richtig ist <b>"+w.richtig+"</b>. "+K.tipp);
    fb.innerHTML=""; fb.appendChild(d);
    focusFeedback(d, correct?null:host.querySelector("#gwsNext"));
  });
  host.querySelector("#gwsNext").onclick=()=>{
    if(!answered){ needAnswer(fb, "Wähle zuerst ein Wort – dann geht es weiter."); return; }
    gwsIdx=i+1; renderSpellPaged(host, K, key); window.scrollTo(0,0); };
}

  const o=stufenDraft;
  if(scope==="global") return o.global||0;
  if(scope.indexOf("klasse:")===0) return (o.klasse||{})[scope.slice(7)]||0;
  return (o.felder||{})[scope.slice(5)]||0;
}
function draftSet(scope, v){
  const o=stufenDraft;
  if(scope==="global") o.global=v;
  else if(scope.indexOf("klasse:")===0){ o.klasse=o.klasse||{}; if(v===0) delete o.klasse[scope.slice(7)]; else o.klasse[scope.slice(7)]=v; }
  else { o.felder=o.felder||{}; const k=scope.slice(5); if(v===0) delete o.felder[k]; else o.felder[k]=v; }
}
function draftDirty(){ return JSON.stringify(stufenDraft)!==JSON.stringify(store.stufen); }
function stufenApply(){
  store.stufen=JSON.parse(JSON.stringify(stufenDraft));
  save();
  // Verlässlich überall aktivieren: laufende Runden und Zähler zurücksetzen,
  // damit jede Übung sofort mit dem neuen Wort-Pool startet.
  resetAllIdx();
  scoreRuns={};
  stufenSaved=true;
}
function segLine(label, scope, max){
  const cur=draftVal(scope);
  const btns=[0,1,2,3].map(v=>{
    const dis = v>0 && max && v>max;
    return `<button class="seg${cur===v?" on":""}" data-scope="${scope}" data-v="${v}"${dis?" disabled":""}>${v===0?"Auto":v}</button>`;
  }).join("");
  return `<div class="seg-line"><span class="seg-label">${label}</span><div class="seg-row">${btns}</div></div>`;
}
function renderAdminStufen(c){
  draftInit();
  const dirty=draftDirty();
  const feldRows = Object.keys(MOD_FIELD).map(mid=>{
    const fk=MOD_FIELD[mid], m=MODULES[mid];

  const gwsRows = GWS_KATEGORIEN.map(k=>

  const status = dirty
    ? `<div class="lvl-note" style="text-align:left;">✏️ Änderungen noch nicht gespeichert.</div>`
    : (stufenSaved ? `<div class="lvl-note up" style="text-align:left;">✅ <b>Gespeichert.</b> Die Stufen sind jetzt in allen Aufgaben aktiv.</div>` : ``);
  c.innerHTML = admHeader("stufen") + `
    <div class="card">
      <h3>🎯 Stufen steuern</h3>
      <p class="muted"><b>Auto</b> = Stufen werden durch Üben freigeschaltet.
      <b>1–3</b> = Stufe gilt fest (📌). Der erspielte Fortschritt bleibt
      gespeichert und gilt wieder, sobald „Auto" gewählt ist.<br>
      Vorrang: <b>Bereich</b> vor <b>Klassenstufe</b> vor <b>Global</b>.</p>
      ${segLine("🌍 Global (alle Bereiche)","global",3)}
      ${segLine("📗 Nur Klasse 3","klasse:3",3)}
      ${segLine("📘 Nur Klasse 4","klasse:4",3)}
    </div>
    <div class="card"><h3>Je Lernfeld</h3>${feldRows}</div>
    <div class="card"><h3>Je Grundwortschatz-Gruppe</h3>${gwsRows}</div>
    <div class="card">
      ${status}
      <button class="btn-primary" id="stufenSave" style="width:100%;"${dirty?"":" disabled"}>💾 Speichern &amp; aktivieren</button>
      <button class="btn-secondary btn-small mt" id="stufenDiscard" style="width:100%;"${dirty?"":" disabled"}>Änderungen verwerfen</button>
    </div>`;
  admBindTabs(c);
  c.querySelectorAll(".seg[data-scope]").forEach(b=>b.onclick=()=>{
    draftSet(b.dataset.scope, parseInt(b.dataset.v,10));
    stufenSaved=false;
    const y=window.scrollY; renderAdminStufen(c); window.scrollTo(0,y);

}

let store = {
  name:"",
  lastModule:"vorgang",
  level:3,        // Klassenstufe: 3, 4 oder 0 (= alle)
  thema:"alltag", // globales Thema für alle Satz-Übungen

  gwsWords:{},    // Elternbereich: eigene Wortlisten je Grundwortschatz-Gruppe
  stufen:{ global:0, klasse:{}, felder:{} }, // Stufen-Steuerung: 0 = automatisch, 1–3 = fest
  vorgang:{ rezept:"waffel", self:{ groups:[[0,0,0,0],[0,0,0,0]], form:[false,false,false,false] } },
  subjekt:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  praedikat:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  satzglieder:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  rede:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  zeit:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  grossklein:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  dassdas:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  wortarten:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  faelle:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  doppel:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  gws:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  kompass:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } }
};
const KEY = "lernapp_v1";
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!d) return;
    if(typeof d.name==="string") store.name=d.name;
    if([0,3,4].includes(d.level)) store.level=d.level;
    if(d.thema && THEMEN.some(t=>t.id===d.thema)) store.thema=d.thema;
    if(d.lastModule && MODULES[d.lastModule]) store.lastModule=d.lastModule;
    if(d.vorgang){
      if(REZEPTE[d.vorgang.rezept]) store.vorgang.rezept=d.vorgang.rezept;
      if(d.vorgang.self) mergeSelf(store.vorgang.self, d.vorgang.self);
    }
    ["subjekt","praedikat","satzglieder","rede","zeit","grossklein","dassdas","wortarten","faelle","doppel","kompass","gws"].forEach(m=>{
      if(d[m] && d[m].self) mergeSelf(store[m].self, d[m].self);
    });
    if(d.progress && typeof d.progress==="object"){
      Object.keys(d.progress).forEach(k=>{ const v=d.progress[k];
        if(v && typeof v==="object") store.progress[k]={
          unlocked:Math.max(1,Math.min(3,parseInt(v.unlocked,10)||1)),
          runs:Math.max(0,parseInt(v.runs,10)||0),
          crown:!!v.crown }; });
    }
    if(d.gwsWords && typeof d.gwsWords==="object"){
      const cleanList = a => (Array.isArray(a)?a:[])
        .filter(w=>w && typeof w.richtig==="string" && typeof w.falsch==="string"
                 && w.richtig.trim() && w.falsch.trim() && w.richtig!==w.falsch)
        .map(w=>({richtig:w.richtig.trim(), falsch:w.falsch.trim()}));
      Object.keys(d.gwsWords).forEach(id=>{
        if(!GWS_KATEGORIEN.some(k=>k.id===id)) return;
        const v=d.gwsWords[id]||{};
        const L=cleanList(v.leicht), S=cleanList(v.schwer);
        if(L.length+S.length>0) store.gwsWords[id]={leicht:L, schwer:S};
      });
    }
    if(d.stufen && typeof d.stufen==="object"){
      const cv=v=>{ v=parseInt(v,10); return (v>=0&&v<=3)?v:0; };
      store.stufen.global=cv(d.stufen.global);
      if(d.stufen.klasse) ["3","4"].forEach(k=>{ if(k in d.stufen.klasse) store.stufen.klasse[k]=cv(d.stufen.klasse[k]); });
      if(d.stufen.felder) Object.keys(d.stufen.felder).forEach(k=>{
        const v=cv(d.stufen.felder[k]); if(v>=1) store.stufen.felder[k]=v; });
    }
  }catch(e){}
}
// Übernimmt gespeicherte Werte, ohne die Größe der Zielarrays zu sprengen
function mergeSelf(target, src){
  if(src && Array.isArray(src.groups)){
    src.groups.forEach((g,i)=>{ if(target.groups[i] && Array.isArray(g)){
      g.forEach((v,j)=>{ if(j<target.groups[i].length) target.groups[i][j]=v; }); } });
  }
  if(src && Array.isArray(src.form)) src.form.forEach((v,i)=>{ if(i<target.form.length) target.form[i]=v; });
}
function updateGreeting(){ $("greeting").textContent = store.name ? ("Hallo, "+store.name+"!") : "Hallo!"; }

// Setzt alle Übungs-Zähler zurück (bei Themenwechsel)
function resetAllIdx(){
  subjIdx=frageIdx=praedIdx=sgIdx=sgPhase=redeIdx=zeitIdx=gkIdx=ddIdx=waIdx=faelleIdx=doppelIdx=kompLeseIdx=kompUebIdx=kompTextIdx=kompBereichIdx=gwsCatIdx=gwsIdx=0;
  scoreRuns={};
}
function buildThemeRow(){
  const row=$("themeRow"); row.innerHTML="";
  THEMEN.forEach(t=>{
    const b=document.createElement("button");
    b.className="level-btn"+(t.id===store.thema?" active":"");
    b.innerHTML=`${t.emoji} ${t.name}`;
    b.onclick=()=>{ store.thema=t.id; resetAllIdx(); save(); buildThemeRow(); };
    row.appendChild(b);
  });
}
function buildModuleChooser(){
  const grid=$("moduleChooser"); grid.innerHTML="";
  Object.keys(MODULES)
    .filter(id=> store.level===0 || (MODUL_KLASSE[id]||[3,4]).includes(store.level))
    .forEach(id=>{
    const m=MODULES[id];
    const div=document.createElement("div");
    div.className="choice";
    const fk=MOD_FIELD[id];
    const lvlTag = fk ? `<span class="card-lvl">🎯 Stufe ${fieldLevel(fk)}/${fieldMax(fk)}${fieldProg(fk).crown?" 👑":""}</span>` : "";
    div.innerHTML=`<span class="emoji">${m.emoji}</span>${m.name}${lvlTag}`;
    div.onclick=()=>openModule(id);
    grid.appendChild(div);
  });
}
function openModule(id){
  activeModuleId=id; store.lastModule=id;
  // Vorgangsbeschreibung folgt dem globalen Thema, wenn ein passender Ablauf existiert
  if(id==="vorgang" && REZEPTE[store.thema]) store.vorgang.rezept=store.thema;
  save();
  subjIdx=0; frageIdx=0; praedIdx=0; sgIdx=0; sgPhase=0; redeIdx=0; zeitIdx=0;
  gkIdx=0; ddIdx=0; waIdx=0; faelleIdx=0; doppelIdx=0; kompLeseIdx=0; kompUebIdx=0; kompTextIdx=0; kompBereichIdx=0; gwsCatIdx=0; gwsIdx=0; vgTries=0; vgWritten=[false,false,false,false,false];
  scoreRuns={};
  goSection(MODULES[id].sections[0].id);
}
function goHome(){
  activeSectionId=null;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $("screen-home").classList.add("active");
  buildModuleChooser(); // Stufen-Abzeichen auf den Karten aktualisieren
  renderNav();
  window.scrollTo(0,0);
}
function goSection(secId){
  const m=MODULES[activeModuleId];
  const sec=m.sections.find(s=>s.id===secId) || m.sections[0];
  activeSectionId=sec.id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $("screen-content").classList.add("active");
  sec.render($("moduleContent"));
  renderNav();
  window.scrollTo(0,0);
}
function renderNav(){
  const nav=$("bottomNav"); nav.innerHTML="";
  nav.appendChild(navItem("🏠","Start",goHome, activeSectionId===null));
  if(activeModuleId){
    MODULES[activeModuleId].sections.forEach(sec=>{
      nav.appendChild(navItem(sec.icon, sec.label, ()=>goSection(sec.id), activeSectionId===sec.id));
    });
  }
}
function navItem(icon,label,onclick,active){
  const b=document.createElement("button");
  b.className="nav-item"+(active?" active":"");
  b.innerHTML=`<span class="ni">${icon}</span>${label}`;
  b.onclick=onclick;
  return b;
}

/* ============================================================
   START
   ============================================================ */
document.addEventListener("DOMContentLoaded",()=>{
  load();
  buildThemeRow();
  buildLevelRow();
  buildModuleChooser();
  const ni=$("nameInput");
  ni.value=store.name;
  updateGreeting();
  ni.oninput=()=>{ store.name=ni.value.trim(); save(); updateGreeting(); };
  // Level-Up Overlay schließen
  $("lvlupClose").onclick=hideLevelUp;
  $("levelUp").addEventListener("click",e=>{ if(e.target.id==="levelUp") hideLevelUp(); });
  // Zurück-Button + Elternbereich
  $("backBtn").onclick=goHome;
  $("adminLink").onclick=openAdmin;
  // letztes Lernfeld für die Navigation vormerken, aber auf der Startseite bleiben
  activeModuleId = (store.lastModule && MODULES[store.lastModule]) ? store.lastModule : null;
  goHome();
});

/* Service Worker (PWA) – nur über http/https.
   Bei einer neuen Version lädt die Seite einmal automatisch neu,
   damit nie eine veraltete Version hängen bleibt. */
if("serviceWorker" in navigator && (location.protocol==="https:" || location.protocol==="http:")){
  let refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(refreshing) return; refreshing=true; location.reload();
  });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("service-worker.js").then(reg=>{ reg.update(); }).catch(()=>{});
  });
}
</script>
