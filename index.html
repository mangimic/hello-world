<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- PWA -->
<meta name="theme-color" content="#4a7fd6">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernprofi">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">

<title>Deutsch üben</title>
<style>
/* =========================================================
   MOBILE-FIRST GRUNDLAYOUT
   ========================================================= */
:root{
  --bg:#eef4fb; --card:#ffffff;
  --primary:#4a7fd6; --primary-dark:#3a67b0;
  --green:#5bb98c; --green-dark:#489a72;
  --yellow:#f5c451; --text:#2c3a4b; --muted:#6b7a8d; --soft:#dce7f4;
  --blue-ink:#1c56b3;
  --radius:18px; --shadow:0 6px 18px rgba(60,90,140,0.12);
  --nav-h:66px; --tap:48px;
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  --safe-top:env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; overflow-x:hidden; max-width:100%;}
body{
  font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5; font-size:18px;
  padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 12px);
  -webkit-text-size-adjust:100%;
}
.app{width:100%; max-width:760px; margin:0 auto; padding:12px; padding-top:calc(12px + var(--safe-top));}
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:14px;}
h1{font-size:24px; margin:0 0 8px;}
h2{font-size:21px; margin:0 0 12px;}
h3{font-size:18px; margin:0 0 8px;}
p{margin:0 0 12px;}
.muted{color:var(--muted); font-size:16px;}
.center{text-align:center;}
.mt{margin-top:12px;}

/* Buttons */
button{
  font-family:inherit; font-size:18px; cursor:pointer; border:none; border-radius:14px;
  padding:14px 18px; min-height:var(--tap); touch-action:manipulation;
  transition:transform .08s ease, background .15s ease;
}
button:active{transform:scale(0.97);}
.btn-primary{background:var(--primary); color:#fff; font-weight:700; width:100%; padding:18px; font-size:20px; min-height:58px;}
.btn-secondary{background:var(--soft); color:var(--text); font-weight:600;}
.btn-green{background:var(--green); color:#fff; font-weight:700; width:100%;}
.btn-small{font-size:16px; padding:10px 16px;}
.btn-quiet{background:transparent; color:var(--muted); font-size:14px; text-decoration:underline; padding:10px; min-height:auto;}
@media (hover:hover){
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-secondary:hover{background:#cdddf0;}
  .btn-green:hover{background:var(--green-dark);}
}

/* Auswahl-Karten (Lernfeld / Thema) */
.choice-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0;}
.choice{
  background:var(--soft); border:3px solid transparent; border-radius:16px; padding:18px 12px;
  text-align:center; font-size:17px; font-weight:700; color:var(--text); min-height:96px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
}
.choice .emoji{display:block; font-size:34px; margin-bottom:6px;}
.choice.selected{border-color:var(--primary); background:#e4eefb;}

/* Klassenstufen-Auswahl */
.level-row{display:flex; gap:8px; margin:6px 0 12px;}
.level-btn{flex:1; background:var(--soft); color:var(--text); font-weight:700; border-radius:14px; min-height:46px; font-size:16px;}
.level-btn.active{background:var(--primary); color:#fff;}
/* Themen-Auswahl (2x2) */
.theme-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0 4px;}

/* Chips */
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0;}
.chip{background:#e4eefb; border:2px solid var(--primary); color:var(--primary-dark);
  border-radius:20px; padding:8px 14px; font-weight:700; font-size:15px;}
button.chip{cursor:pointer; min-height:auto; font-family:inherit; line-height:1.2;}
button.chip.on{background:var(--primary); color:#fff;}
@media (hover:hover){ button.chip:hover{background:#d3e3f8;} button.chip.on:hover{background:var(--primary-dark);} }

/* "So geht's" */
.howto{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
.howto-step{display:flex; align-items:center; gap:12px; background:var(--soft); border-radius:14px; padding:12px;}
.howto-step .n{background:var(--primary); color:#fff; width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-weight:800; flex:0 0 auto;}

.hint{background:#fff8e6; border-left:4px solid var(--yellow); padding:12px 14px; border-radius:8px; font-size:20px; margin:12px 0;}
.example-box{background:var(--soft); border-radius:14px; padding:14px; font-size:19px; margin:10px 0;}
.feedback{margin-top:10px; padding:12px 14px; border-radius:12px; font-size:17px; font-weight:700;}
.feedback.ok{background:#e6f6ee; color:var(--green-dark);}
.feedback.tip{background:#fff8e6; color:#a67c19;}
/* Kompass: Lesetext & Quiz-Optionen */
.lesetext{font-size:18px; line-height:1.65;}
.quiz-opt{display:block; width:100%; margin:6px 0; text-align:left; background:var(--soft); color:var(--text); font-weight:600; border-radius:12px; padding:12px 14px; font-size:17px;}
.quiz-opt.ok{background:#e6f6ee;}
.quiz-opt.no{background:#fbeceb;}

/* Wörter zum Antippen (Subjekt) */
.sentence-box{font-size:22px; line-height:2.2; margin:10px 0;}
.word{display:inline-block; padding:2px 6px; margin:2px 0; border-radius:8px; cursor:pointer;
  border-bottom:3px solid transparent;}
.word.sel{color:var(--blue-ink); font-weight:700; border-bottom-color:var(--blue-ink); background:#eaf1fc;}
.word.selp{color:#b23b3b; font-weight:700; border-bottom-color:#b23b3b; background:#fbeceb;}
.word.selr{color:#7a4fb3; font-weight:700; border-bottom-color:#7a4fb3; background:#f1ebfa;}
@media (hover:hover){ .word:hover{background:#eef2f8;} }
.wa-target{background:#fff4d6; border-radius:6px; padding:2px 8px; font-weight:800; color:#a67c19;}

/* Lösung */
.gate-count{background:var(--soft); border-radius:12px; padding:12px; margin:8px 0; font-size:17px;}
.final-solution{background:#eaf7f0; border-radius:14px; padding:16px; font-size:18px; line-height:1.7;}
.final-solution ol{padding-left:22px; margin:6px 0 0;}
.final-solution li{margin:8px 0;}
.btn-locked{background:#e6e9ee; color:#9aa6b4;}
#worksheet .sol-list{padding-left:22px;}
#worksheet .sol-list li{margin:8px 0;}

/* Blumentopf-Skala */
.crit{background:var(--soft); border-radius:14px; padding:12px; margin-bottom:10px;}
.crit .frage{font-size:17px; font-weight:600; margin-bottom:8px;}
.pot-row{display:flex; gap:8px; justify-content:space-between;}
.pot{
  flex:1 1 0; max-width:78px; background:#fff; border:3px solid transparent; border-radius:14px;
  padding:6px 2px 4px; min-height:var(--tap); cursor:pointer; display:flex; flex-direction:column; align-items:center;
}
.pot svg{width:100%; height:auto; max-width:52px; opacity:.5; filter:grayscale(.55); transition:all .15s;}
.pot .plabel{font-size:11px; color:var(--muted); font-weight:700; margin-top:2px;}
.pot.selected{border-color:var(--green); background:#eaf7f0;}
.pot.selected svg{opacity:1; filter:none;}
.pot.selected .plabel{color:var(--green-dark);}

/* Häkchenliste */
.checklist{list-style:none; padding:0; margin:0;}
.checklist li{display:flex; align-items:center; gap:12px; padding:14px; background:var(--soft);
  border-radius:12px; margin-bottom:8px; font-size:17px; min-height:var(--tap); cursor:pointer;}
.checklist input{width:26px; height:26px; flex:0 0 auto;}

/* "Deine Blume" */
.bloom{background:#eaf7f0; border-radius:18px; padding:20px; text-align:center;}
.bloom svg{width:120px; height:auto;}
.bloom .txt{font-size:19px; font-weight:700; color:var(--green-dark); margin-top:8px;}

/* Untere Navigation (dynamisch) */
.bottom-nav{position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex;
  background:var(--card); box-shadow:0 -4px 16px rgba(60,90,140,0.12); padding-bottom:var(--safe-bottom);}
.nav-item{flex:1; background:transparent; border:none; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px; height:var(--nav-h); min-height:var(--tap);
  color:var(--muted); font-size:11px; font-weight:600; border-radius:0; padding:2px;}
.nav-item .ni{font-size:23px; line-height:1;}
.nav-item.active{color:var(--primary);}

/* Screens */
.screen{display:none;}
.screen.active{display:block;}

@media (min-width:600px){
  .choice-grid{grid-template-columns:repeat(3,1fr);}
  body{font-size:19px;}
}

/* Arbeitsblatt (Vorschau) */
#worksheet{background:#fff; color:#000; border:1px solid #ccc; border-radius:8px; padding:20px; font-size:16px;}
#worksheet .ws-head{display:flex; align-items:center; gap:12px; border:2px solid #000; border-radius:10px; padding:10px 14px; margin-bottom:14px;}
#worksheet .ws-head .pen{font-size:30px;}
#worksheet h2{font-size:19px; margin:0;}
#worksheet .ws-name{margin:14px 0; font-size:17px;}
#worksheet .ws-task{background:#f2f6fc; border:1.5px solid #000; border-radius:8px; padding:10px 12px; margin:12px 0; font-size:15px; line-height:1.45;}
#worksheet .ws-box{border:1.5px solid #000; border-radius:8px; padding:10px; margin:12px 0;}
#worksheet .ws-step{margin:20px 0;}
#worksheet .ws-step .lead{font-weight:700; margin-bottom:2px;}
#worksheet .ws-step .cue{color:#555; font-size:14px; margin-bottom:12px;}
#worksheet .writeline{border-bottom:1.6px solid #333; height:46px; margin:0 0 12px;}
#worksheet .starters{font-size:14px; color:#333; border:1.2px dashed #666; border-radius:8px; padding:8px 10px; margin:12px 0;}
#worksheet .ws-check{margin-top:12px;}
#worksheet .ws-check .cline{display:flex; align-items:center; gap:8px; margin:6px 0; font-size:15px;}
#worksheet .ws-check .cbox{width:18px; height:18px; border:1.6px solid #000; border-radius:3px; flex:0 0 auto;}

/* Druck */
@media print{
  @page{ margin:14mm; }
  body{background:#fff; padding:0; font-size:12pt;}
  .app{max-width:none; padding:0;}
  .bottom-nav, .screen{display:none !important;}
  #printArea{display:block !important;}
  #worksheet{border:none; border-radius:0; padding:0; font-size:12pt;}
  #worksheet .writeline{height:12mm;}
}
#printArea{display:none;}
</style>
</head>
<body>
<div class="app">

  <!-- ========== STARTSEITE: Lernfeld wählen ========== -->
  <section id="screen-home" class="screen active">
    <div class="card center">
      <div style="font-size:46px;">✏️😊</div>
      <h1 id="greeting">Hallo!</h1>
      <p>Was möchtest du heute üben?</p>
      <input id="nameInput" type="text" maxlength="20" placeholder="Dein Name (freiwillig)" style="max-width:280px; margin:6px auto 0; text-align:center;">
      <p class="muted" style="font-size:13px; margin-top:6px;">Wird nur auf diesem Gerät gespeichert.</p>
    </div>
    <div class="card">
      <h2>Thema</h2>
      <p class="muted" style="margin-bottom:4px;">Gilt für alle Übungen mit Sätzen.</p>
      <div class="theme-grid" id="themeRow"></div>
    </div>

    <div class="card">
      <h2>Wähle ein Lernfeld</h2>
      <div class="level-row" id="levelRow">
        <button class="level-btn" data-level="3">Klasse 3</button>
        <button class="level-btn" data-level="4">Klasse 4</button>
        <button class="level-btn" data-level="0">Alle</button>
      </div>
      <div class="choice-grid" id="moduleChooser"></div>
    </div>
  </section>

  <!-- ========== INHALTSBEREICH (füllt das aktive Modul) ========== -->
  <section id="screen-content" class="screen">
    <div id="moduleContent"></div>
  </section>

</div>

<!-- Druckbereich -->
<div id="printArea"></div>

<!-- Untere Navigation (wird je Modul dynamisch aufgebaut) -->
<nav class="bottom-nav" id="bottomNav"></nav>

<script>
"use strict";
/* ============================================================
   LERN-APP – Modul-System („Lernfelder")
   Jedes Lernfeld ist ein eigenständiges Modul mit eigenen
   Bereichen (Reitern). Das Grundgerüst (Navigation, Blumentopf-
   Selbstcheck, Druck, Speichern) ist generisch.
   Neues Thema = neues Modul-Objekt in MODULES – sonst nichts.
   Reines HTML/CSS/JS, offline (PWA), Daten nur im localStorage.
   ============================================================ */

const $ = (id)=>document.getElementById(id);

// Globale Themen (gelten für alle Satz-Übungen). Neues Thema = hier + in jedem *_THEMEN ergänzen.
const THEMEN = [
  {id:"alltag",   name:"Alltag",  emoji:"🌳"},
  {id:"angeln",   name:"Angeln",  emoji:"🎣"},
  {id:"tennis",   name:"Tennis",  emoji:"🎾"},
  {id:"fussball", name:"Fußball", emoji:"⚽"}
];
function themaName(){ const t=THEMEN.find(x=>x.id===store.thema); return t?t.name:"Alltag"; }

/* ============================================================
   GEMEINSAME BAUSTEINE
   ============================================================ */
const POT_LABELS = ["fängt an","wächst","stark","aufgeblüht"];

// Blumentopf-SVG in 4 Wachstumsstufen (Topf → Keim → Pflanze → Blüte)
function potSVG(stufe){
  const topf = `
    <path d="M16 46 h28 l-4 20 h-20 z" fill="#c47a4a"/>
    <rect x="13" y="41" width="34" height="7" rx="2.5" fill="#d98a58"/>
    <ellipse cx="30" cy="44.5" rx="15" ry="2.6" fill="#5e3f24"/>`;
  let p = "";
  if(stufe===1){ p = `<ellipse cx="30" cy="43" rx="2.4" ry="1.5" fill="#7a5230"/>`; }
  else if(stufe===2){ p = `
      <path d="M30 44 V33" stroke="#3f9d54" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="24.5" cy="35" rx="5" ry="3" fill="#5bb98c" transform="rotate(-25 24.5 35)"/>
      <ellipse cx="35.5" cy="34" rx="5" ry="3" fill="#5bb98c" transform="rotate(25 35.5 34)"/>`; }
  else if(stufe===3){ p = `
      <path d="M30 44 V24" stroke="#3f9d54" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="22.5" cy="34" rx="6" ry="3.4" fill="#5bb98c" transform="rotate(-28 22.5 34)"/>
      <ellipse cx="37.5" cy="32" rx="6" ry="3.4" fill="#5bb98c" transform="rotate(28 37.5 32)"/>
      <ellipse cx="24" cy="26" rx="5" ry="3" fill="#6ec79a" transform="rotate(-22 24 26)"/>`; }
  else{ p = `
      <path d="M30 44 V22" stroke="#3f9d54" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="22" cy="34" rx="6" ry="3.4" fill="#5bb98c" transform="rotate(-28 22 34)"/>
      <ellipse cx="38" cy="32" rx="6" ry="3.4" fill="#5bb98c" transform="rotate(28 38 32)"/>
      <g>
        <circle cx="30" cy="14" r="4.2" fill="#f5c451"/>
        <circle cx="30" cy="7.5" r="3.6" fill="#ef8fb3"/>
        <circle cx="36.5" cy="12" r="3.6" fill="#ef8fb3"/>
        <circle cx="34" cy="18.5" r="3.6" fill="#ef8fb3"/>
        <circle cx="26" cy="18.5" r="3.6" fill="#ef8fb3"/>
        <circle cx="23.5" cy="12" r="3.6" fill="#ef8fb3"/>
      </g>`; }
  return `<svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${p}${topf}</svg>`;
}

// Generischer Blumentopf-Selbstcheck: cfg = {groups:[{title,fragen:[]}], form:[]}
//                                      st  = {groups:[[..]], form:[..]}
function renderFlower(c, cfg, st){
  c.innerHTML = `
    <div class="card"><h2>🌱 Meine Blume</h2>
      <p>Schätze selbst ein – so wie deine Lehrerin es auch macht. Tippe pro Zeile den Topf an,
      der am besten passt. <b>Es gibt keine Noten</b> – deine Blume wächst mit jedem Schritt! 🌷</p></div>
    <div class="card" id="flowerGroups"></div>
    <div class="card"><h3>Form &amp; Schrift <span class="muted">(ohne Bewertung)</span></h3>
      <p class="muted">Nur zum Abhaken.</p><ul class="checklist" id="flowerForm"></ul></div>
    <div class="card"><h3>Deine Blume</h3>
      <div class="bloom"><div id="bloomIcon"></div><div class="txt" id="bloomText"></div></div>
      <button class="btn-quiet mt" id="flowerReset" style="width:100%;">Neu einschätzen</button></div>`;
  const gc = c.querySelector("#flowerGroups");
  cfg.groups.forEach((g,gi)=>{
    const h=document.createElement("h3"); h.textContent=g.title; h.style.marginTop = gi ? "16px":"0"; gc.appendChild(h);
    g.fragen.forEach((frage,i)=>{
      const crit=document.createElement("div"); crit.className="crit";
      crit.innerHTML=`<div class="frage">${frage}</div>`;
      const row=document.createElement("div"); row.className="pot-row"; const pots=[];
      for(let stufe=1; stufe<=4; stufe++){
        const b=document.createElement("button");
        b.className="pot"+(st.groups[gi][i]===stufe?" selected":"");
        b.innerHTML=potSVG(stufe)+`<span class="plabel">${POT_LABELS[stufe-1]}</span>`;
        b.onclick=()=>{ st.groups[gi][i]=stufe; save();
          pots.forEach((pp,idx)=>pp.classList.toggle("selected", idx+1===stufe)); updateBloom(c,st); };
        pots.push(b); row.appendChild(b);
      }
      crit.appendChild(row); gc.appendChild(crit);
    });
  });
  const fl=c.querySelector("#flowerForm");
  cfg.form.forEach((t,i)=>{
    const li=document.createElement("li");
    li.innerHTML=`<input type="checkbox" ${st.form[i]?"checked":""}> <span>${t}</span>`;
    li.querySelector("input").onchange=e=>{ st.form[i]=e.target.checked; save(); };
    li.onclick=e=>{ if(e.target.tagName!=="INPUT"){ const b=li.querySelector("input"); b.checked=!b.checked; st.form[i]=b.checked; save(); } };
    fl.appendChild(li);
  });
  c.querySelector("#flowerReset").onclick=()=>{
    if(confirm("Einschätzung zurücksetzen?")){ st.groups.forEach(a=>a.fill(0)); st.form.fill(false); save(); renderFlower(c,cfg,st); }
  };
  updateBloom(c,st);
}
function updateBloom(c, st){
  const all=[].concat(...st.groups).filter(v=>v>0);
  const icon=c.querySelector("#bloomIcon"), txt=c.querySelector("#bloomText");
  if(!all.length){ icon.innerHTML=potSVG(1); txt.textContent="Tippe oben die Töpfe an, dann wächst deine Blume."; return; }
  const avg=all.reduce((a,b)=>a+b,0)/all.length;
  const stufe=Math.max(1,Math.min(4,Math.round(avg)));
  icon.innerHTML=potSVG(stufe);
  txt.textContent={
    1:"🌱 Dein Pflänzchen fängt an zu wachsen. Toll, dass du geübt hast!",
    2:"🌿 Deine Pflanze wächst schön. Weiter so!",
    3:"🌷 Deine Blume wird richtig stark! Super gemacht.",
    4:"🌸 Wow, deine Blume ist voll aufgeblüht! Klasse Arbeit."
  }[stufe];
}

// Generisches Drucken: Inhalt in den Druckbereich, dann drucken
function printHTML(inner){
  $("printArea").innerHTML = '<div id="worksheet">'+inner+'</div>';
  window.print();
}

/* ============================================================
   MODUL 1: VORGANGSBESCHREIBUNG
   ============================================================ */
const SATZANFAENGE = ["Zuerst","Anschließend","Danach","Nun","Als Nächstes","Zum Schluss"];

const REZEPTE = {
  waffel:{ name:"Waffelrezept", emoji:"🧇", titel:"Mein Waffelrezept",
    zutaten:"5 Eier, 250 g Zucker, 250 g weiche Butter, 500 g Mehl, 1 Päckchen Vanillezucker, 1 Päckchen Backpulver, 500 ml Milch, Puderzucker, Waffeleisen",
    stich:"Eier, Zucker, Butter – Schüssel – Mixer",
    beispiele:[
      "Zuerst gebe ich die Eier, den Zucker und die weiche Butter in eine Schüssel und verrühre alles mit dem Mixer.",
      "Danach füge ich die Milch hinzu und rühre alles zu einem glatten Teig.",
      "Zum Schluss lege ich die fertige Waffel auf einen Teller und bestreue sie mit Puderzucker."],
    loesung:[
      "Zuerst gebe ich 5 Eier, 250 g Zucker und 250 g weiche Butter in eine Schüssel und verrühre alles mit dem Mixer.",
      "Anschließend gebe ich 500 g Mehl, ein Päckchen Vanillezucker und ein Päckchen Backpulver dazu und vermische es.",
      "Danach füge ich 500 ml Milch hinzu und rühre alles zu einem glatten Teig.",
      "Nun gebe ich den Teig mit einem Löffel in das heiße Waffeleisen und backe die Waffeln.",
      "Zum Schluss lege ich die fertige Waffel auf einen Teller, bestreue sie mit Puderzucker und genieße sie."],
    schritte:[
      {lead:"Schritt 1", cue:"5 Eier + 250 g Zucker + 250 g weiche Butter → Schüssel → verrühren"},
      {lead:"Schritt 2", cue:"500 g Mehl + Vanillezucker + Backpulver → dazugeben → vermischen"},
      {lead:"Schritt 3", cue:"500 ml Milch → hinzufügen → zu glattem Teig verrühren"},
      {lead:"Schritt 4", cue:"Teig mit Löffel → ins Waffeleisen → backen"},
      {lead:"Schritt 5", cue:"Waffel → auf einen Teller → mit Puderzucker bestreuen"}
    ]},
  toast:{ name:"Toast machen", emoji:"🍞", titel:"So mache ich einen Toast",
    zutaten:"2 Scheiben Toastbrot, Butter, Toaster, Messer, Teller",
    stich:"Brot – Toaster – warten",
    beispiele:[

function vgSolution(c){
  const r=REZEPTE[store.vorgang.rezept];
  c.innerHTML = `
    <div class="card"><h2>🔑 Lösung</h2>
      <p>Die Lösung zeigt dir, wie ein guter Text aussehen kann. Aber <b>erst selbst versuchen!</b> 💪</p></div>
    <div class="card" id="gateCard">
      <h3>Erst selbst probieren</h3>
      <p class="muted"><b>1)</b> Hast du es selbst versucht? Tippe nach jedem Versuch:</p>
      <button class="btn-secondary btn-small" id="tryBtn">Ich habe es versucht</button>
      <div class="gate-count">Versuche: <b><span id="tryCount">${vgTries}</span> / 3</b></div>
      <p class="muted mt"><b>2)</b> Welche Schritte hast du schon auf dein Blatt geschrieben?</p>
      <ul class="checklist" id="writtenList"></ul>
      <div class="hint" id="gateStatus"></div>
      <button class="btn-primary btn-locked" id="showSolutionBtn" disabled>🔒 Lösung anzeigen</button></div>
    <div class="card" id="solutionCard" style="display:none;">
      <h3>So kann ein guter Text aussehen</h3>
      <div id="solutionText" class="final-solution"></div>
      <button class="btn-green mt" id="printSolutionBtn" style="width:100%;">Lösung drucken</button>
      <button class="btn-quiet" id="resetSolutionBtn" style="width:100%;">Neu versuchen</button></div>`;
  const ul=c.querySelector("#writtenList");
  for(let i=0;i<5;i++){
    const li=document.createElement("li");
    li.innerHTML=`<input type="checkbox" ${vgWritten[i]?"checked":""}> <span>Schritt ${i+1} geschrieben</span>`;
    li.querySelector("input").onchange=e=>{ vgWritten[i]=e.target.checked; vgGate(c); };
    li.onclick=e=>{ if(e.target.tagName!=="INPUT"){ const b=li.querySelector("input"); b.checked=!b.checked; vgWritten[i]=b.checked; vgGate(c); } };
    ul.appendChild(li);
  }
  c.querySelector("#tryBtn").onclick=()=>{ if(vgTries<3)vgTries++; c.querySelector("#tryCount").textContent=vgTries; vgGate(c); };
  c.querySelector("#showSolutionBtn").onclick=()=>{
    if(c.querySelector("#showSolutionBtn").disabled) return;
    c.querySelector("#solutionText").innerHTML=vgSolutionInner(r);
    c.querySelector("#solutionCard").style.display="block";
    c.querySelector("#solutionCard").scrollIntoView({behavior:"smooth"});
  };
  c.querySelector("#printSolutionBtn").onclick=()=>printHTML(vgSolutionInner(r));
  c.querySelector("#resetSolutionBtn").onclick=()=>{ vgTries=0; vgWritten=[false,false,false,false,false]; vgSolution(c); };
  vgGate(c);
}
function vgGate(c){
  const writtenCount=vgWritten.filter(Boolean).length;
  const ok = vgTries>=3 && writtenCount>=3;
  const btn=c.querySelector("#showSolutionBtn");
  btn.disabled=!ok; btn.classList.toggle("btn-locked",!ok);
  btn.textContent = ok ? "Lösung anzeigen" : "🔒 Lösung anzeigen";
  const status=c.querySelector("#gateStatus");
  if(ok){ status.textContent="Super, du hast fleißig geübt! Jetzt darfst du die Lösung ansehen. 🌟"; }
  else{
    const teile=[];
    if(vgTries<3) teile.push("noch "+(3-vgTries)+"× „Ich habe es versucht“");
    if(writtenCount<3) teile.push("mindestens "+Math.max(0,3-writtenCount)+" Schritt(e) mehr abhaken");
    status.textContent="Fast! Du brauchst noch: "+teile.join(" und ")+".";
  }
}

  return `<div class="ws-head"><span class="pen">✏️</span><h2>${r.titel}</h2></div>

}

function sjFrage(c){
  const S=subjSaetze();

  const s=S[frageIdx];
  c.innerHTML = `
    <div class="card">
      <h2>❓ Wer oder Was?</h2>

      </div>
      <div id="ffb"></div>
      <button class="btn-primary mt" id="nextF">Nächster Satz</button>
    </div>`;
  const check=(art)=>{
    const correct = art===s.art;
    const d=document.createElement("div");
    d.className="feedback "+(correct?"ok":"tip");
    if(correct){
      d.textContent = (s.art==="wer")
        ? "Richtig! „"+s.subjektText+"“ ist eine Person → Wer? 🌟"
        : "Richtig! „"+s.subjektText+"“ ist ein Ding oder Tier → Was? 🌟";
    }else{
      d.textContent = "Fast! Überlege: Ist „"+s.subjektText+"“ eine Person (Wer?) oder ein Ding/Tier (Was?)?";
    }
    const fb=c.querySelector("#ffb"); fb.innerHTML=""; fb.appendChild(d);
  };
  c.querySelector("#werBtn").onclick=()=>check("wer");
  c.querySelector("#wasBtn").onclick=()=>check("was");
  c.querySelector("#nextF").onclick=()=>{ frageIdx=(frageIdx+1)%S.length; sjFrage(c); window.scrollTo(0,0); };

function sgUeben(c){
  const S=satzgliedSaetze();
  if(sgIdx>=S.length) sgIdx=0;
  const s=S[sgIdx];
  const target = sgPhase===0 ? s.subj : s.praed;
  const cls = sgPhase===0 ? "sel" : "selp";
  const selected=new Set();
  const instr = sgPhase===0
    ? "Finde zuerst das <b>Subjekt</b> (Wer oder was?)."
    : "Jetzt das <b>Prädikat</b> (Was tut / was passiert?).";
  c.innerHTML=`
    <div class="card">
      <h2>🧩 Satzglieder</h2>
      <p class="muted">Satz ${sgIdx+1} von ${S.length} · Teil ${sgPhase+1} von 2</p>
      <div class="hint">${instr}</div>

      <div id="gfb"></div>
      <div style="display:flex; gap:10px; margin-top:12px;">

        <button class="btn-primary btn-small" id="nextBtn" style="flex:1;">Nächster Satz</button>
      </div>
    </div>`;
  const box=c.querySelector("#gbox");
  s.woerter.forEach((w,i)=>{
    const sp=document.createElement("span"); sp.className="word"; sp.textContent=w;
    if(sgPhase===1 && s.subj.includes(i)){
      sp.classList.add("sel"); // gefundenes Subjekt bleibt blau sichtbar

      sp.onclick=()=>{ if(selected.has(i)){selected.delete(i);sp.classList.remove(cls);} else {selected.add(i);sp.classList.add(cls);} c.querySelector("#gfb").innerHTML=""; };
    }
    box.appendChild(sp); box.appendChild(document.createTextNode(" "));
  });
  c.querySelector("#checkBtn").onclick=()=>{
    const chosen=[...selected].sort((a,b)=>a-b);
    const correct = chosen.length===target.length && chosen.every((v,k)=>v===target[k]);
    const fb=c.querySelector("#gfb");
    if(correct){
      if(sgPhase===0){ sgPhase=1; sgUeben(c); }
      else{
        const d=document.createElement("div"); d.className="feedback ok";
        d.textContent="Geschafft! Subjekt (blau) und Prädikat (rot) gefunden. 🌟";
        fb.innerHTML=""; fb.appendChild(d);
      }
    }else{
      const d=document.createElement("div"); d.className="feedback tip";
      d.textContent = sgPhase===0 ? "Fast! Frag: Wer oder was? – tippe nur das Subjekt an."

      fb.innerHTML=""; fb.appendChild(d);
    }
  };
  c.querySelector("#nextBtn").onclick=()=>{ sgIdx=(sgIdx+1)%S.length; sgPhase=0; sgUeben(c); window.scrollTo(0,0); };
}

  if(zeitIdx>=S.length) zeitIdx=0;
  const s=S[zeitIdx];
  c.innerHTML=`
    <div class="card">
      <h2>⏰ Zeitformen</h2>
      <p class="muted">Satz ${zeitIdx+1} von ${S.length}</p>
      <div class="sentence-box">${s.satz}</div>
      <p>In welcher <b>Zeitform</b> steht der Satz?</p>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        <button class="btn-secondary" id="praesBtn">Präsens<br><small>jetzt</small></button>
        <button class="btn-secondary" id="praetBtn">Präteritum<br><small>früher</small></button>
        <button class="btn-secondary" id="perfBtn">Perfekt<br><small>habe/bin … ge…</small></button>
        <button class="btn-secondary" id="futBtn">Futur<br><small>werde …</small></button>
      </div>
      <div id="zfb"></div>
      <button class="btn-primary mt" id="nextBtn">Nächster Satz</button>
    </div>`;
  const texte={
    praesens:"Richtig! Das passiert jetzt → Präsens. 🌟",
    praeteritum:"Richtig! Das war früher → Präteritum. 🌟",
    perfekt:"Richtig! Vergangenheit mit haben/sein → Perfekt. 🌟",
    futur:"Richtig! Das passiert später → Futur. 🌟"
  };
  const check=(form)=>{
    const correct = form===s.form;
    const d=document.createElement("div"); d.className="feedback "+(correct?"ok":"tip");
    d.textContent = correct ? texte[s.form]
      : "Fast! Achte auf das Zeitwort: jetzt (Präsens), früher (Präteritum), habe/bin … (Perfekt) oder werde … (Futur)?";
    const fb=c.querySelector("#zfb"); fb.innerHTML=""; fb.appendChild(d);
  };
  c.querySelector("#praesBtn").onclick=()=>check("praesens");
  c.querySelector("#praetBtn").onclick=()=>check("praeteritum");
  c.querySelector("#perfBtn").onclick=()=>check("perfekt");
  c.querySelector("#futBtn").onclick=()=>check("futur");
  c.querySelector("#nextBtn").onclick=()=>{ zeitIdx=(zeitIdx+1)%S.length; zeitUeben(c); window.scrollTo(0,0); };

// Quiz-Engine mit sofortigem Feedback + Begründung + Auswertung am Ende.
// state hält den Punktestand über alle Aufgaben (res[i] = "first"/"later"/"wrong"/"open").
function renderQuizPaged(host, items, getIdx, setIdx, state){
  if(!state){ state={res:[]}; }
  let i=getIdx();
  if(i>=items.length){ return renderQuizResult(host, items, getIdx, setIdx, state); }
  const it=items[i];
  let answered=false, wrongTries=0;
  host.innerHTML = `
    <p class="muted">Aufgabe ${i+1} von ${items.length}</p>
    <p style="font-size:19px;"><b>${it.frage}</b></p>
    <div id="opts"></div>
    <div id="qfb"></div>
    <button class="btn-primary btn-small mt" id="qnext" style="width:100%;">Weiter</button>`;
  const fb=host.querySelector("#qfb");
  const opts=host.querySelector("#opts");
  if(it.typ==="reveal"){
    answered=true; state.res[i]="open"; // offene Frage: selbst prüfen, „Weiter“ immer erlaubt
    const rev=document.createElement("button");
    rev.className="btn-secondary btn-small"; rev.style.width="100%"; rev.textContent="Lösung zeigen";
    rev.onclick=()=>{ fb.innerHTML=""; const d=document.createElement("div"); d.className="feedback ok";
      d.textContent="Mögliche Lösung: "+it.loesung; fb.appendChild(d); };
    opts.appendChild(rev);
  } else {
    it.optionen.forEach((o,oi)=>{
      const b=document.createElement("button"); b.className="quiz-opt"; b.textContent=o;
      b.onclick=()=>{
        if(answered) return; // nach einer gültigen Antwort nicht mehr weiterzählen
        const correct = oi===it.loesung;
        const d=document.createElement("div");
        if(correct){
          answered=true; b.classList.add("ok");
          state.res[i] = wrongTries===0 ? "first" : "later";
          d.className="feedback ok"; d.textContent="Richtig! 🌟 "+(it.erkl||"");
        }else{
          wrongTries++; b.classList.add("no");
          d.className="feedback tip";
          if(wrongTries>=2){
            answered=true; state.res[i]="wrong";
            d.innerHTML="Das war noch nicht richtig. Die richtige Antwort ist <b>"+it.optionen[it.loesung]+"</b>.<br>"+(it.erkl||"");
            [...opts.children].forEach((bb,bi)=>{ if(bi===it.loesung) bb.classList.add("ok"); });
          }else{
            d.textContent="Das stimmt noch nicht. 💡 "+(it.tipp||"Überlege noch einmal.");
          }
        }
        fb.innerHTML=""; fb.appendChild(d);
      };
      opts.appendChild(b);
    });
  }
  host.querySelector("#qnext").onclick=()=>{
    if(!answered){
      fb.innerHTML=""; const d=document.createElement("div"); d.className="feedback tip";
      d.textContent="Wähle zuerst eine Antwort – dann siehst du, ob sie richtig war.";
      fb.appendChild(d); return;
    }
    setIdx(i+1);
    renderQuizPaged(host, items, getIdx, setIdx, state);
    window.scrollTo(0,0);
  };
}
// Auswertung + Einwertung am Ende einer Übungsreihe, mit „Nochmal üben".
function renderQuizResult(host, items, getIdx, setIdx, state){
  const mc = items.filter(x=>x.typ!=="reveal").length;
  const open = items.length - mc;
  let first=0, later=0, wrong=0;
  for(let k=0;k<items.length;k++){
    if(state.res[k]==="first") first++;
    else if(state.res[k]==="later") later++;
    else if(state.res[k]==="wrong") wrong++;
  }
  const geschafft = first+later;            // insgesamt richtig gelöst
  const ratio = mc>0 ? first/mc : 1;        // Anteil „auf Anhieb"
  let stufe, titel, text;
  if(ratio>=0.85){ stufe=3; titel="Aufgeblüht! 🌸"; text="Klasse gemacht – fast alles auf Anhieb richtig!"; }
  else if(ratio>=0.6){ stufe=2; titel="Stark! 🌼"; text="Sehr gut – vieles konntest du direkt lösen."; }
  else if(ratio>=0.35){ stufe=1; titel="Du wächst! 🌱"; text="Guter Weg – mit ein bisschen Übung wird es sicherer."; }
  else { stufe=0; titel="Guter Anfang! 🌰"; text="Kein Problem – wiederhole die Aufgaben ruhig noch einmal."; }
  host.innerHTML = `
    <h3 style="text-align:center;margin:4px 0;">Deine Auswertung</h3>
    <div style="text-align:center;margin:6px 0;">${potSVG(stufe)}</div>
    <p style="text-align:center;font-size:20px;font-weight:800;margin:2px 0;">${titel}</p>
    <p style="text-align:center;" class="muted">${text}</p>
    <div class="example-box" style="margin-top:10px;">
      🌟 <b>Auf Anhieb richtig:</b> ${first} von ${mc}<br>
      ✅ <b>Insgesamt gelöst:</b> ${geschafft} von ${mc}${later?` (davon ${later} nach einem Tipp)`:``}<br>
      ${wrong?`🔁 <b>Nochmal anschauen:</b> ${wrong}<br>`:``}
      ${open?`📝 <b>Offene Fragen zum Selbst-Prüfen:</b> ${open}`:``}
    </div>
    <button class="btn-primary mt" id="qagain" style="width:100%;">🔁 Nochmal üben</button>`;
  host.querySelector("#qagain").onclick=()=>{
    setIdx(0);
    renderQuizPaged(host, items, getIdx, setIdx, {res:[]});
    window.scrollTo(0,0);
  };
}

function komLesen(c){

  const L=KOMP_TEXTE[kompTextIdx];
  if(kompLeseIdx>=L.fragen.length) kompLeseIdx=0; // beendete Runde: frisch starten
  const chooser = KOMP_TEXTE.map((t,ti)=>
    `<button class="chip${ti===kompTextIdx?" on":""}" data-ti="${ti}">${t.emoji} ${t.titel}</button>`).join("");
  c.innerHTML = `
    <div class="card"><h2>📚 Leseverstehen</h2><p class="muted">Wähle einen Text. Lies ihn genau und beantworte dann die Fragen.</p>
      <div class="chip-row">${chooser}</div></div>
    <div class="card"><h3>${L.emoji} ${L.titel}</h3><div class="lesetext">${L.text}</div></div>
    <div class="card" id="quizHost"></div>`;
  c.querySelectorAll(".chip[data-ti]").forEach(b=>b.onclick=()=>{
    kompTextIdx=+b.dataset.ti; kompLeseIdx=0;
    komLesen(c);
  });
  renderQuizPaged(c.querySelector("#quizHost"), L.fragen, ()=>kompLeseIdx, v=>kompLeseIdx=v);
}

   ============================================================ */
let store = {
  name:"",
  lastModule:"vorgang",
  level:3,        // Klassenstufe: 3, 4 oder 0 (= alle)
  thema:"alltag", // globales Thema für alle Satz-Übungen
  vorgang:{ rezept:"waffel", self:{ groups:[[0,0,0,0],[0,0,0,0]], form:[false,false,false,false] } },
  subjekt:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  praedikat:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  satzglieder:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  rede:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  zeit:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  grossklein:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  dassdas:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  wortarten:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  faelle:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  doppel:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } },
  kompass:{ self:{ groups:[[0,0,0,0]], form:[false,false,false] } }
};
const KEY = "lernapp_v1";
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!d) return;
    if(typeof d.name==="string") store.name=d.name;
    if([0,3,4].includes(d.level)) store.level=d.level;
    if(d.thema && THEMEN.some(t=>t.id===d.thema)) store.thema=d.thema;
    if(d.lastModule && MODULES[d.lastModule]) store.lastModule=d.lastModule;
    if(d.vorgang){
      if(REZEPTE[d.vorgang.rezept]) store.vorgang.rezept=d.vorgang.rezept;
      if(d.vorgang.self) mergeSelf(store.vorgang.self, d.vorgang.self);
    }
    ["subjekt","praedikat","satzglieder","rede","zeit","grossklein","dassdas","wortarten","faelle","doppel","kompass"].forEach(m=>{
      if(d[m] && d[m].self) mergeSelf(store[m].self, d[m].self);
    });
  }catch(e){}
}
// Übernimmt gespeicherte Werte, ohne die Größe der Zielarrays zu sprengen
function mergeSelf(target, src){
  if(src && Array.isArray(src.groups)){
    src.groups.forEach((g,i)=>{ if(target.groups[i] && Array.isArray(g)){
      g.forEach((v,j)=>{ if(j<target.groups[i].length) target.groups[i][j]=v; }); } });
  }
  if(src && Array.isArray(src.form)) src.form.forEach((v,i)=>{ if(i<target.form.length) target.form[i]=v; });
}
function updateGreeting(){ $("greeting").textContent = store.name ? ("Hallo, "+store.name+"!") : "Hallo!"; }

/* ============================================================
   GRUNDGERÜST: Startseite, Navigation, Screen-Wechsel
   ============================================================ */
let activeModuleId = null;
let activeSectionId = null;

// Welche Lernfelder gehören zu welcher Klassenstufe (mehrere möglich)
const MODUL_KLASSE = {
  vorgang:[3,4], subjekt:[3,4], praedikat:[3,4], satzglieder:[3,4], rede:[3,4],
  zeit:[3,4], grossklein:[3], wortarten:[3,4], dassdas:[4], faelle:[4], doppel:[3], kompass:[4]
};
function buildLevelRow(){
  document.querySelectorAll("#levelRow .level-btn").forEach(b=>{
    b.classList.toggle("active", parseInt(b.dataset.level,10)===store.level);
    b.onclick=()=>{ store.level=parseInt(b.dataset.level,10); save(); buildLevelRow(); buildModuleChooser(); };
  });
}
// Setzt alle Übungs-Zähler zurück (bei Themenwechsel)
function resetAllIdx(){
  subjIdx=frageIdx=praedIdx=sgIdx=sgPhase=redeIdx=zeitIdx=gkIdx=ddIdx=waIdx=faelleIdx=doppelIdx=kompLeseIdx=kompUebIdx=kompTextIdx=kompBereichIdx=0;
}
function buildThemeRow(){
  const row=$("themeRow"); row.innerHTML="";
  THEMEN.forEach(t=>{
    const b=document.createElement("button");
    b.className="level-btn"+(t.id===store.thema?" active":"");
    b.innerHTML=`${t.emoji} ${t.name}`;
    b.onclick=()=>{ store.thema=t.id; resetAllIdx(); save(); buildThemeRow(); };
    row.appendChild(b);
  });
}
function buildModuleChooser(){
  const grid=$("moduleChooser"); grid.innerHTML="";
  Object.keys(MODULES)
    .filter(id=> store.level===0 || (MODUL_KLASSE[id]||[3,4]).includes(store.level))
    .forEach(id=>{
    const m=MODULES[id];
    const div=document.createElement("div");
    div.className="choice";
    div.innerHTML=`<span class="emoji">${m.emoji}</span>${m.name}`;
    div.onclick=()=>openModule(id);
    grid.appendChild(div);
  });
}
function openModule(id){
  activeModuleId=id; store.lastModule=id;
  // Vorgangsbeschreibung folgt dem globalen Thema, wenn ein passender Ablauf existiert
  if(id==="vorgang" && REZEPTE[store.thema]) store.vorgang.rezept=store.thema;
  save();
  subjIdx=0; frageIdx=0; praedIdx=0; sgIdx=0; sgPhase=0; redeIdx=0; zeitIdx=0;
  gkIdx=0; ddIdx=0; waIdx=0; faelleIdx=0; doppelIdx=0; kompLeseIdx=0; kompUebIdx=0; kompTextIdx=0; kompBereichIdx=0; vgTries=0; vgWritten=[false,false,false,false,false];
  goSection(MODULES[id].sections[0].id);
}
function goHome(){
  activeSectionId=null;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $("screen-home").classList.add("active");
  renderNav();
  window.scrollTo(0,0);
}
function goSection(secId){
  const m=MODULES[activeModuleId];
  const sec=m.sections.find(s=>s.id===secId) || m.sections[0];
  activeSectionId=sec.id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $("screen-content").classList.add("active");
  sec.render($("moduleContent"));
  renderNav();
  window.scrollTo(0,0);
}
function renderNav(){
  const nav=$("bottomNav"); nav.innerHTML="";
  nav.appendChild(navItem("🏠","Start",goHome, activeSectionId===null));
  if(activeModuleId){
    MODULES[activeModuleId].sections.forEach(sec=>{
      nav.appendChild(navItem(sec.icon, sec.label, ()=>goSection(sec.id), activeSectionId===sec.id));
    });
  }
}
function navItem(icon,label,onclick,active){
  const b=document.createElement("button");
  b.className="nav-item"+(active?" active":"");
  b.innerHTML=`<span class="ni">${icon}</span>${label}`;
  b.onclick=onclick;
  return b;
}

/* ============================================================
   START
   ============================================================ */
document.addEventListener("DOMContentLoaded",()=>{
  load();
  buildThemeRow();
  buildLevelRow();
  buildModuleChooser();
  const ni=$("nameInput");
  ni.value=store.name;
  updateGreeting();
  ni.oninput=()=>{ store.name=ni.value.trim(); save(); updateGreeting(); };
  // letztes Lernfeld für die Navigation vormerken, aber auf der Startseite bleiben
  activeModuleId = (store.lastModule && MODULES[store.lastModule]) ? store.lastModule : null;
  goHome();
});

/* Service Worker (PWA) – nur über http/https.
   Bei einer neuen Version lädt die Seite einmal automatisch neu,
   damit nie eine veraltete Version hängen bleibt. */
if("serviceWorker" in navigator && (location.protocol==="https:" || location.protocol==="http:")){
  let refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(refreshing) return; refreshing=true; location.reload();
  });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("service-worker.js").then(reg=>{ reg.update(); }).catch(()=>{});
  });
}
