<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Apfel-Insel: Insel mit Palme, Schatztruhe und Apfel-Stapel -->
  <rect width="512" height="512" rx="96" fill="#5bc98c"/>
  <circle cx="256" cy="276" r="170" fill="#aee3ff"/>
  <clipPath id="c"><circle cx="256" cy="276" r="170"/></clipPath>
  <g clip-path="url(#c)">
    <rect x="86" y="290" width="340" height="80" fill="#3d8fe0"/>
    <path d="M86 446 L86 360 Q256 322 426 360 L426 446 Z" fill="#f2d99a"/>
  </g>
  <!-- Palme -->
  <g>
    <path d="M148 380 q10 -52 -6 -98" stroke="#9a6b42" stroke-width="15" fill="none" stroke-linecap="round"/>
    <g stroke="#3fae72" stroke-width="12" fill="none" stroke-linecap="round">
      <path d="M142 282 q-32 -14 -55 2"/>
      <path d="M142 282 q-27 13 -35 34"/>
      <path d="M142 282 q32 -17 53 -2"/>
      <path d="M142 282 q29 11 36 34"/>
    </g>
    <circle cx="134" cy="288" r="9" fill="#6d4a2f"/>
    <circle cx="152" cy="292" r="9" fill="#6d4a2f"/>
  </g>
  <!-- Schatztruhe -->
  <g>
    <rect x="290" y="330" width="120" height="72" rx="12" fill="#9a6b42"/>
    <path d="M290 344 a60 34 0 0 1 120 0 z" fill="#b5854f"/>
    <rect x="290" y="338" width="120" height="12" fill="#6d4a2f"/>
    <rect x="340" y="330" width="20" height="40" rx="5" fill="#ffd66b"/>
    <circle cx="350" cy="352" r="6" fill="#f0a10f"/>
  </g>
  <!-- Apfel-Stapel in der Truhe -->
  <g>
    <circle cx="330" cy="316" r="26" fill="#e74c3c"/>
    <circle cx="372" cy="312" r="26" fill="#e74c3c"/>
    <circle cx="350" cy="272" r="27" fill="#f0a10f"/>
    <path d="M350 238 q4 -12 13 -16" stroke="#6d4a2f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="334" cy="236" rx="12" ry="7" fill="#3fae72" transform="rotate(-25 334 236)"/>
    <circle cx="340" cy="264" r="5" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Möwen -->
  <path d="M150 140 q14 -12 28 0 q-14 -4 -28 0" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M330 108 q14 -12 28 0 q-14 -4 -28 0" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- rotes Schatzkreuz -->
  <g stroke="#e74c3c" stroke-width="10" stroke-linecap="round">
    <path d="M196 396 l26 26 M222 396 l-26 26"/>
  </g>
</svg>
