<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Apfel-Igel: Igel mit Apfel-Stapel auf einer Insel -->
  <rect width="512" height="512" rx="96" fill="#5bc98c"/>
  <circle cx="256" cy="276" r="170" fill="#aee3ff"/>
  <!-- Meer + Insel-Sand im Kreis -->
  <clipPath id="c"><circle cx="256" cy="276" r="170"/></clipPath>
  <g clip-path="url(#c)">
    <rect x="86" y="300" width="340" height="80" fill="#3d8fe0"/>
    <path d="M86 446 L86 372 Q256 336 426 372 L426 446 Z" fill="#f2d99a"/>
  </g>
  <!-- Palme -->
  <g>
    <path d="M150 372 q10 -50 -6 -95" stroke="#9a6b42" stroke-width="14" fill="none" stroke-linecap="round"/>
    <g stroke="#3fae72" stroke-width="11" fill="none" stroke-linecap="round">
      <path d="M144 277 q-30 -14 -52 2"/>
      <path d="M144 277 q-26 12 -34 32"/>
      <path d="M144 277 q30 -16 50 -2"/>
      <path d="M144 277 q28 10 34 32"/>
    </g>
  </g>
  <!-- Stacheln -->
  <g fill="#5d3f28">
    <polygon points="200,340 170,270 235,305"/>
    <polygon points="235,320 235,240 280,300"/>
    <polygon points="285,325 320,250 325,315"/>
  </g>
  <!-- Körper -->
  <ellipse cx="280" cy="356" rx="95" ry="58" fill="#8a5a3b"/>
  <!-- Gesicht -->
  <ellipse cx="348" cy="344" rx="42" ry="36" fill="#e8c9a0"/>
  <circle cx="348" cy="330" r="7" fill="#2c2c2c"/>
  <circle cx="381" cy="352" r="10" fill="#2c2c2c"/>
  <!-- Füße -->
  <ellipse cx="245" cy="410" rx="20" ry="11" fill="#6d4a2f"/>
  <ellipse cx="315" cy="410" rx="20" ry="11" fill="#6d4a2f"/>
  <!-- Apfel-Stapel -->
  <g>
    <circle cx="262" cy="248" r="32" fill="#e74c3c"/>
    <circle cx="272" cy="190" r="32" fill="#e74c3c"/>
    <circle cx="265" cy="132" r="32" fill="#f0a10f"/>
    <path d="M265 100 q4 -12 13 -16" stroke="#6d4a2f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="249" cy="97" rx="12" ry="7" fill="#3fae72" transform="rotate(-25 249 97)"/>
    <circle cx="254" cy="122" r="5" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Möwe -->
  <g fill="#ffffff">
    <path d="M120 150 q14 -12 28 0 q-14 -4 -28 0" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M370 105 q14 -12 28 0 q-14 -4 -28 0" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
