<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Apfel-Igel: Igel mit Apfel-Stapel auf grünem Grund -->
  <rect width="512" height="512" rx="96" fill="#5bc98c"/>
  <circle cx="256" cy="276" r="170" fill="#e7ffe3"/>
  <!-- Stacheln -->
  <g fill="#5d3f28">
    <polygon points="160,330 120,240 200,290"/>
    <polygon points="190,300 180,200 240,270"/>
    <polygon points="240,290 250,190 290,270"/>
    <polygon points="290,300 320,210 330,290"/>
  </g>
  <!-- Körper -->
  <ellipse cx="250" cy="330" rx="110" ry="70" fill="#8a5a3b"/>
