<!DOCTYPE html>

<head>

<!-- PWA -->

<title>Apfel-Igel – 100 Level</title>
<style>
/* =========================================================
   APFEL-IGEL – Geschicklichkeitsspiel ab 8 Jahren
   100 Level, Einzeldatei-PWA, offline, werbefrei.
   ========================================================= */
:root{
  --bg1:#d8f3ff; --bg2:#e7ffe3;
  --card:#ffffff;
  --green:#5bc98c; --green-dark:#3fae72;
  --red:#e74c3c; --gold:#f0a10f; --blue:#54a9ff;
  --brown:#8a5a3b;
  --text:#3a4a3b; --muted:#8a9a8b;
  --radius:22px;
  --shadow:0 8px 22px rgba(40,120,70,0.18);
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
html,body{margin:0; height:100%; overflow:hidden;}
body{
  font-family:"Comic Sans MS","Marker Felt","Segoe UI",sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--text); font-size:19px;
  touch-action:manipulation;
}

.screen{
  position:fixed; inset:0; display:none; flex-direction:column;
  padding:calc(10px + var(--safe-top)) 12px calc(10px + var(--safe-bottom));
  max-width:860px; margin:0 auto; left:0; right:0;
}
.screen.active{display:flex;}

h1{font-size:44px; margin:8px 0 0; text-align:center; text-shadow:0 3px 0 rgba(255,255,255,0.7);}
.sub{text-align:center; color:var(--muted); margin:4px 0 18px; font-size:20px;}

.btn{
  border:none; border-radius:var(--radius); cursor:pointer;
  font-family:inherit; font-size:22px; font-weight:bold; color:#fff;
  background:linear-gradient(180deg,var(--green),var(--green-dark));
  padding:16px 22px; box-shadow:var(--shadow);
  transition:transform .1s;
}
.btn:active{transform:scale(0.96);}
.btn.blue{background:linear-gradient(180deg,#6ab5ff,#3d8fe0);}
.btn.gray{background:linear-gradient(180deg,#b8c4bb,#93a096);}
.btn.small{font-size:17px; padding:10px 16px; border-radius:16px;}

.stack-btns{display:flex; flex-direction:column; gap:14px; width:min(340px,86%); margin:0 auto;}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
.topbar .title{font-size:24px; font-weight:bold;}

/* ---------- Startbildschirm ---------- */
#scr-start{justify-content:center; align-items:center; text-align:center;}
#start-igel{font-size:84px; line-height:1; margin-bottom:4px; animation:wobble 3s ease-in-out infinite;}
@keyframes wobble{0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)}}
#start-stars{margin-top:16px; color:var(--muted); font-size:18px;}

/* ---------- Levelauswahl ---------- */
#level-grid{
  flex:1; overflow-y:auto; display:grid; gap:10px;
  grid-template-columns:repeat(auto-fill, minmax(64px,1fr));
  padding:4px 2px 18px; align-content:start;
}
.lvl-btn{
  border:none; border-radius:16px; cursor:pointer; font-family:inherit;
  aspect-ratio:1; font-size:20px; font-weight:bold; color:#fff;
  background:linear-gradient(180deg,var(--green),var(--green-dark));
  box-shadow:0 4px 10px rgba(40,120,70,0.2);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
.lvl-btn .st{font-size:11px; letter-spacing:-1px; line-height:1;}
.lvl-btn.locked{background:linear-gradient(180deg,#c9d2cb,#a8b2aa); cursor:default;}
.lvl-btn.night{background:linear-gradient(180deg,#7d6ce0,#5747b8);}
.lvl-btn.night.locked{background:linear-gradient(180deg,#c9d2cb,#a8b2aa);}
.lvl-btn:not(.locked):active{transform:scale(0.94);}

/* ---------- Spiel ---------- */
#scr-game{padding:0; max-width:none;}
#game-wrap{position:absolute; inset:0;}
#game-canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}
#hud{
  position:absolute; top:calc(6px + var(--safe-top)); left:8px; right:8px;
  display:flex; align-items:center; gap:10px; pointer-events:none; z-index:5;
  font-weight:bold; font-size:18px;
}
#hud .pill{
  background:rgba(255,255,255,0.85); border-radius:14px; padding:6px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.12);
}
#hud-progress{flex:1; max-width:220px; position:relative; overflow:hidden;}
#hud-bar{position:absolute; inset:0; background:linear-gradient(90deg,#a5e8c3,#5bc98c); width:0%; z-index:-1; transition:width .25s;}
#hud button{pointer-events:auto; border:none; font-family:inherit; cursor:pointer; font-size:20px;
  background:rgba(255,255,255,0.85); border-radius:14px; padding:6px 12px; box-shadow:0 2px 8px rgba(0,0,0,0.12);}

/* ---------- Overlay ---------- */
#overlay{
  position:fixed; inset:0; display:none; align-items:center; justify-content:center;
  background:rgba(30,50,40,0.55); z-index:20; padding:16px;
}
#overlay.active{display:flex;}
#ov-card{
  background:var(--card); border-radius:26px; box-shadow:var(--shadow);
  padding:26px 24px; width:min(420px,94%); text-align:center;
  animation:pop .25s ease-out;
}
@keyframes pop{from{transform:scale(0.8); opacity:0} to{transform:scale(1); opacity:1}}
#ov-title{font-size:30px; font-weight:bold; margin-bottom:6px;}
#ov-sub{color:var(--muted); font-size:19px; white-space:pre-line; margin-bottom:14px;}
#ov-stars{font-size:42px; letter-spacing:6px; margin-bottom:14px; min-height:10px;}
#ov-btns{display:flex; flex-direction:column; gap:10px;}
</style>

<body>

<!-- ================= Startbildschirm ================= -->
<div class="screen active" id="scr-start">
  <div id="start-igel">🦔🏝</div>
  <h1>Apfel-Igel</h1>
  <div class="sub">Stapel die Äpfel auf deiner Insel – 100 Level!</div>
  <div class="stack-btns">
    <button class="btn" id="btn-play">▶ Spielen</button>
    <button class="btn blue" id="btn-levels">🗺 Levelauswahl</button>
    <button class="btn gray" id="btn-help">❓ Anleitung</button>
  </div>
  <div id="start-stars"></div>
</div>

<!-- ================= Levelauswahl ================= -->
<div class="screen" id="scr-levels">
  <div class="topbar">
    <button class="btn gray small" id="btn-lvl-back">◀ Zurück</button>
    <div class="title">Levelauswahl</div>
    <div class="pill" id="lvl-total">⭐ 0/300</div>
  </div>
  <div id="level-grid"></div>
</div>

<!-- ================= Spiel ================= -->
<div class="screen" id="scr-game">
  <div id="game-wrap"><canvas id="game-canvas"></canvas></div>
  <div id="hud">
    <div class="pill" id="hud-level">Level 1</div>
    <div class="pill" id="hud-progress"><div id="hud-bar"></div><span id="hud-apples">🍎 0/10</span></div>
    <div class="pill" id="hud-hearts">❤️❤️❤️</div>
    <button id="btn-pause" title="Pause">⏸</button>
    <button id="btn-sound" title="Ton">🔊</button>
  </div>
</div>

<!-- ================= Overlay ================= -->
<div id="overlay">
  <div id="ov-card">
    <div id="ov-title"></div>
    <div id="ov-sub"></div>
    <div id="ov-stars"></div>
    <div id="ov-btns"></div>
  </div>
</div>

<script>
"use strict";
/* =========================================================
   Apfel-Igel – Spiel-Logik
   ========================================================= */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand  = (a,b) => a + Math.random()*(b-a);

/* ---------- Speicher ---------- */
const STORE_KEY = "felix.apfeligel";
const store = {
  data: { unlocked:1, stars:{}, sound:true },
  load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) this.data = Object.assign(this.data, JSON.parse(raw));
    }catch(e){}
  },
  save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); }catch(e){} },
  totalStars(){ return Object.values(this.data.stars).reduce((a,b)=>a+b,0); }
};
store.load();

/* ---------- Level-Konfiguration (1–100) ---------- */
const MAX_LEVEL = 100;
function levelConfig(n){
  return {
    level: n,
    goal:      Math.min(10 + Math.floor(n*0.4), 45),          // Äpfel bis zum Sieg
    fallSpeed: Math.min(120 + n*2.4, 380),                    // px/s
    spawn:     Math.max(0.55, 1.65 - n*0.011),                // s zwischen Äpfeln
    doubleP:   Math.min(0.05 + n*0.004, 0.45),                // Chance auf Doppel-Apfel
    goldP:     0.06,                                          // Chance auf Gold-Apfel (+3)
    faulP:     n < 5 ? 0 : Math.min(0.06 + n*0.0018, 0.24),   // Chance auf faulen Apfel
    gullEvery: n < 8 ? 0 : Math.max(5.5, 15 - n*0.09),        // s zwischen Möwen
    wind:      n < 25 ? 0 : Math.min(30 + (n-25)*1.4, 120),   // max. Seitenwind px/s
    night:     n >= 30 && n % 10 === 0,                       // Nacht-Level
    lives: 3
  };
}
function levelHint(n){
  if(n === 1)  return "Fange die Äpfel mit deinen Stacheln!";
  if(n === 5)  return "NEU: Faule Äpfel (braun) – NICHT fangen!";
  if(n === 8)  return "NEU: Die Möwe klaut Äpfel vom Stapel!";
  if(n === 25) return "NEU: Inselwind! Die Äpfel fliegen schräg.";
  if(n === 30) return "NEU: Nacht-Level – nur deine Laterne leuchtet!";
  if(n === 100)return "Das letzte Level – zeig alles, was du kannst!";
  return "";
}

/* ---------- Ton (WebAudio, winzige Synth-Sounds) ---------- */
const audio = {
  ctx:null,
  ensure(){
    if(!this.ctx){
      try{ this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    }
    if(this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  beep(freq, dur=0.12, type="sine", vol=0.18, delay=0){
    if(!store.data.sound || !this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  catch(){ this.beep(660, 0.1, "sine"); this.beep(880, 0.08, "sine", 0.12, 0.05); },
  gold(){ [660,830,990,1320].forEach((f,i)=>this.beep(f,0.1,"sine",0.16,i*0.06)); },
  bad(){ this.beep(160, 0.25, "sawtooth", 0.2); this.beep(120, 0.3, "square", 0.1, 0.05); },
  gull(){ this.beep(950, 0.09, "square", 0.1); this.beep(700, 0.12, "square", 0.1, 0.09); },
  win(){ [523,659,784,1047].forEach((f,i)=>this.beep(f,0.16,"triangle",0.2,i*0.12)); },
  lose(){ [400,330,260,200].forEach((f,i)=>this.beep(f,0.2,"triangle",0.18,i*0.15)); }
};

/* ---------- Bildschirm-Wechsel ---------- */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
}

/* ---------- Overlay ---------- */
function showOverlay(title, sub, stars, buttons){
  $("#ov-title").textContent = title;
  $("#ov-sub").textContent = sub || "";
  $("#ov-stars").textContent = stars > 0 ? "⭐".repeat(stars) + "☆".repeat(3-stars) : "";
  const box = $("#ov-btns"); box.innerHTML = "";
  buttons.forEach(b=>{
    const el = document.createElement("button");
    el.className = "btn " + (b.cls||""); el.id = b.id; el.textContent = b.label;
    el.addEventListener("click", ()=>{ audio.ensure(); hideOverlay(); b.cb(); });
    box.appendChild(el);
  });
  $("#overlay").classList.add("active");
}
function hideOverlay(){ $("#overlay").classList.remove("active"); }

/* =========================================================
   Spiel
   ========================================================= */
const cv = $("#game-canvas"), ctx = cv.getContext("2d");
const nightCv = document.createElement("canvas"), nctx = nightCv.getContext("2d");
const W = 480;                 // logische Breite, Höhe folgt aus dem Bildschirm
let H = 800, scale = 1;

const APPLE_R = 14, APPLE_H = 24, MAX_STACK = 12;
const HEDGE_W = 86, HEDGE_H = 46;

const game = {
  active:false, state:"idle", timeScale:1,
  level:1, cfg:null, t:0, startT:0,
  spawnT:1, gullT:6,
  hedge:{ x:W/2, tx:W/2, lean:0, px:W/2 },
  stack:[], apples:[], gulls:[], parts:[], floats:[],
  caught:0, lives:3, shake:0, windX:0
};

function resize(){
  const r = $("#game-wrap").getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
  nightCv.width = cv.width; nightCv.height = cv.height;
  scale = cv.width / W;
  H = cv.height / scale;
}
window.addEventListener("resize", resize);

const groundY = () => H - 64;
const stackH  = () => Math.min(game.stack.length, MAX_STACK);
const stackTopY = () => groundY() - HEDGE_H - stackH()*APPLE_H;

function startLevel(n){
  audio.ensure();
  game.level = n; game.cfg = levelConfig(n);
  game.t = 0; game.startT = 0; game.spawnT = 1.2; game.gullT = game.cfg.gullEvery || 999;
  game.hedge.x = game.hedge.tx = game.hedge.px = W/2; game.hedge.lean = 0;
  game.stack = []; game.apples = []; game.gulls = []; game.parts = []; game.floats = [];
  game.caught = 0; game.lives = game.cfg.lives; game.shake = 0;
  game.state = "playing"; game.active = true;
  showScreen("#scr-game"); resize(); updateHUD();
  const hint = levelHint(n);
  if(hint) addFloat(W/2, H*0.35, hint, game.cfg.night ? "#ffffff" : "#3a4a3b", 3.2, 17);
}

function updateHUD(){
  $("#hud-level").textContent = "Level " + game.level + (game.cfg && game.cfg.night ? " 🌙" : "");
  $("#hud-apples").textContent = "🍎 " + game.caught + "/" + game.cfg.goal;
  $("#hud-bar").style.width = Math.min(100, 100*game.caught/game.cfg.goal) + "%";
  $("#hud-hearts").textContent = "❤️".repeat(game.lives) + "🖤".repeat(Math.max(0, 3-game.lives));
  $("#btn-sound").textContent = store.data.sound ? "🔊" : "🔇";
}

/* ---------- Effekte ---------- */
function addFloat(x,y,text,color,life=1.1,size=20){
  game.floats.push({x,y,text,color,life,maxLife:life,size});
}
function burst(x,y,color,n=10){
  for(let i=0;i<n;i++){
    const a = rand(0, Math.PI*2), sp = rand(40,180);
    game.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:rand(0.4,0.8),color,r:rand(2,5)});
  }
}

/* ---------- Sieg / Niederlage ---------- */
function winLevel(){
  game.state = "won"; audio.win();
  for(let i=0;i<5;i++) burst(rand(60,W-60), rand(100,300), ["#ffd66b","#5bc98c","#e74c3c","#54a9ff"][i%4], 14);
  const stars = clamp(game.lives, 1, 3);
  const old = store.data.stars[game.level] || 0;
  if(stars > old) store.data.stars[game.level] = stars;
  if(game.level < MAX_LEVEL) store.data.unlocked = Math.max(store.data.unlocked, game.level+1);
  store.save();
  const done = game.level === MAX_LEVEL;
  setTimeout(()=>{
    const btns = [];
    if(!done) btns.push({id:"ov-next", label:"▶ Level " + (game.level+1), cb:()=>startLevel(game.level+1)});
    btns.push({id:"ov-retry", label:"↻ Nochmal", cls:"blue", cb:()=>startLevel(game.level)});
    btns.push({id:"ov-levels", label:"🗺 Levelauswahl", cls:"gray", cb:openLevels});
    showOverlay(done ? "🏆 ALLE 100 LEVEL!" : "Level " + game.level + " geschafft!",
      done ? "Du bist der Apfel-Igel-Meister!\nGesamt: " + store.totalStars() + " Sterne"
           : "Du hast " + game.caught + " Äpfel gefangen!",
      stars, btns);
  }, 900);
}
function loseLevel(){
  game.state = "lost"; audio.lose();
  setTimeout(()=>{
    showOverlay("Alle Herzen weg!", "Du hattest schon " + game.caught + " von " + game.cfg.goal + " Äpfeln.\nGleich nochmal?", 0, [
      {id:"ov-retry", label:"↻ Nochmal versuchen", cb:()=>startLevel(game.level)},
      {id:"ov-levels", label:"🗺 Levelauswahl", cls:"gray", cb:openLevels}
    ]);
  }, 900);
}
function loseLife(x,y,msg){
  game.lives--; game.shake = 0.5; audio.bad();
  addFloat(x, y-20, msg, "#e74c3c", 1.4, 22);
  updateHUD();
  if(game.lives <= 0) loseLevel();
}

/* ---------- Update ---------- */
function spawnApple(){
  const c = game.cfg, r = Math.random();
  let type = "rot";
  if(r < c.goldP) type = "gold";
  else if(r < c.goldP + c.faulP) type = "faul";
  game.apples.push({
    x: rand(30, W-30), y: -20,
    vy: c.fallSpeed * rand(0.9, 1.15),
    type, rot: rand(-0.4,0.4), spin: rand(-1.5,1.5)
  });
}
function spawnGull(){
  const fromLeft = Math.random() < 0.5;
  game.gulls.push({
    x: fromLeft ? -30 : W+30,
    y: clamp(stackTopY() - rand(0,40), 120, groundY()-60),
    vx: (fromLeft ? 1 : -1) * (110 + game.level*1.2),
    vy: 0, t: rand(0,9), stole:false
  });
}

function update(dt){
  const c = game.cfg;
  game.t += dt;
  if(game.state !== "playing") { updateFx(dt); return; }

  /* Igel bewegen */
  const h = game.hedge;
  const kSpeed = 380 + game.level*1.5;
  if(keys.left)  h.tx -= kSpeed*dt;
  if(keys.right) h.tx += kSpeed*dt;
  h.tx = clamp(h.tx, HEDGE_W/2, W - HEDGE_W/2);
  h.px = h.x;
  h.x += (h.tx - h.x) * Math.min(1, dt*10);
  const vel = (h.x - h.px) / Math.max(dt, 0.001);
  h.lean += (clamp(-vel*0.0009, -0.25, 0.25) - h.lean) * Math.min(1, dt*6);

  /* Wind */
  game.windX = c.wind ? c.wind * Math.sin(game.t*0.55 + game.level) : 0;

  /* Äpfel spawnen */
  game.spawnT -= dt;
  if(game.spawnT <= 0){
    spawnApple();
    if(Math.random() < c.doubleP) spawnApple();
    game.spawnT = c.spawn * rand(0.75, 1.25);
  }

  /* Möwen spawnen */
  if(c.gullEvery){
    game.gullT -= dt;
    if(game.gullT <= 0){ spawnGull(); game.gullT = c.gullEvery * rand(0.8, 1.3); }
  }

  /* Äpfel bewegen + fangen */
  const topY = stackTopY(), gY = groundY();
  for(let i = game.apples.length-1; i >= 0; i--){
    const a = game.apples[i];
    const prevY = a.y;
    a.y += a.vy*dt;
    a.x = clamp(a.x + game.windX*dt, 14, W-14);
    a.rot += a.spin*dt;

    /* gefangen? (Apfel kreuzt die Stapel-Oberkante über dem Igel) */
    if(prevY < topY && a.y >= topY && Math.abs(a.x - h.x) <= HEDGE_W/2 + 10){
      game.apples.splice(i,1);
      if(a.type === "faul"){
        burst(h.x, topY, "#6b5a25", 12);
        loseLife(h.x, topY, "Igitt, faul! 🤢");
      }else if(a.type === "gold"){
        game.caught += 3;
        game.stack.push("gold");
        burst(h.x, topY, "#ffd66b", 14);
        addFloat(h.x, topY-16, "+3", "#f0a10f", 1, 24);
        audio.gold();
      }else{
        game.caught += 1;
        game.stack.push("rot");
        burst(h.x, topY, "#ff9d94", 6);
        addFloat(h.x, topY-16, "+1", "#3fae72", 0.8, 20);
        audio.catch();
      }
      updateHUD();
      if(game.state === "playing" && game.caught >= c.goal){ winLevel(); }
      continue;
    }

    /* auf dem Boden gelandet? */
    if(a.y > gY){
      game.apples.splice(i,1);
      if(a.type === "faul"){
        burst(a.x, gY, "#6b5a25", 8);      /* faule dürfen runterfallen */
      }else{
        burst(a.x, gY, "#e74c3c", 10);
        loseLife(a.x, gY, "-1 ❤️");
      }
    }
  }

  /* Möwen */
  for(let i = game.gulls.length-1; i >= 0; i--){
    const w = game.gulls[i];
    w.t += dt;
    w.x += w.vx*dt; w.y += w.vy*dt + Math.sin(w.t*7)*22*dt;
    if(!w.stole && game.stack.length > 0){
      const tx = h.x, ty = stackTopY() + APPLE_H/2;
      if(Math.abs(w.x - tx) < 22 && Math.abs(w.y - ty) < 26){
        w.stole = true; w.vy = -140;
        game.stack.pop();
        game.caught = Math.max(0, game.caught - 1);
        audio.gull();
        addFloat(tx, ty-20, "-1 🐦", "#4a6a8a", 1.2, 22);
        updateHUD();
      }
    }
    if(w.x < -60 || w.x > W+60 || w.y < -60) game.gulls.splice(i,1);
  }

  updateFx(dt);
}
function updateFx(dt){
  game.shake = Math.max(0, game.shake - dt*1.6);
  for(let i = game.parts.length-1; i >= 0; i--){
    const p = game.parts[i];
    p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 300*dt;
    if(p.life <= 0) game.parts.splice(i,1);
  }
  for(let i = game.floats.length-1; i >= 0; i--){
    const f = game.floats[i];
    f.life -= dt; f.y -= 26*dt;
    if(f.life <= 0) game.floats.splice(i,1);
  }
}

/* ---------- Zeichnen ---------- */
function drawApple(x, y, r, type, rot=0){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  const g = ctx.createRadialGradient(-r*0.3,-r*0.3, r*0.2, 0,0, r);
  if(type === "gold"){ g.addColorStop(0,"#ffe9a0"); g.addColorStop(1,"#f0a10f"); }
  else if(type === "faul"){ g.addColorStop(0,"#a08a4a"); g.addColorStop(1,"#6b5a25"); }
  else { g.addColorStop(0,"#ff7f6e"); g.addColorStop(1,"#c0392b"); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  /* Stiel + Blatt */
  ctx.strokeStyle = "#6d4a2f"; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0,-r+2); ctx.quadraticCurveTo(2,-r-6,5,-r-8); ctx.stroke();
  ctx.fillStyle = type === "faul" ? "#7a8a4a" : "#5bc98c";
  ctx.beginPath(); ctx.ellipse(-6,-r-3,6,3.5,-0.5,0,Math.PI*2); ctx.fill();
  if(type === "faul"){
    ctx.fillStyle = "rgba(60,50,20,0.55)";
    [[-4,2,3],[5,-3,2.5],[1,7,2]].forEach(([sx,sy,sr])=>{
      ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
    });
  }
  if(type === "gold"){
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath(); ctx.arc(-r*0.35,-r*0.35,2.5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawHedgehog(){
  const h = game.hedge, gY = groundY();
  ctx.save();
  ctx.translate(h.x, gY);
  ctx.rotate(h.lean*0.4);
  /* Stacheln */
  ctx.fillStyle = "#5d3f28";
  for(let i = 0; i <= 8; i++){
    const a = Math.PI*(0.1 + 0.8*i/8);
    const bx = -Math.cos(a)*HEDGE_W*0.36, by = -Math.sin(a)*HEDGE_H*0.85;
    const tx = -Math.cos(a)*HEDGE_W*0.56, ty = -Math.sin(a)*(HEDGE_H+16);
    ctx.beginPath();
    ctx.moveTo(bx-6, by); ctx.lineTo(tx, ty); ctx.lineTo(bx+6, by);
    ctx.closePath(); ctx.fill();
  }
  /* Körper */
  ctx.fillStyle = "#8a5a3b";
  ctx.beginPath(); ctx.ellipse(0, -HEDGE_H*0.5, HEDGE_W*0.44, HEDGE_H*0.55, 0, 0, Math.PI*2); ctx.fill();
  /* Gesicht */
  ctx.fillStyle = "#e8c9a0";
  ctx.beginPath(); ctx.ellipse(HEDGE_W*0.3, -HEDGE_H*0.4, HEDGE_W*0.2, HEDGE_H*0.36, -0.2, 0, Math.PI*2); ctx.fill();
  /* Auge + Nase */
  ctx.fillStyle = "#2c2c2c";
  ctx.beginPath(); ctx.arc(HEDGE_W*0.3, -HEDGE_H*0.52, 3.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(HEDGE_W*0.48, -HEDGE_H*0.3, 4.2, 0, Math.PI*2); ctx.fill();
  /* Füße */
  ctx.fillStyle = "#6d4a2f";
  ctx.beginPath(); ctx.ellipse(-HEDGE_W*0.2, -3, 9, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(HEDGE_W*0.16, -3, 9, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  /* Apfel-Stapel */
  const n = stackH();
  for(let i = 0; i < n; i++){
    const sway = Math.sin(game.t*2.2 + i*0.9) * (1 + i*0.5) + game.hedge.lean * i * -26;
    const x = h.x + sway;
    const y = gY - HEDGE_H - (i+0.5)*APPLE_H;
    drawApple(x, y, APPLE_R, game.stack[i]);
  }
  if(game.stack.length > MAX_STACK){
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center";
    const y = gY - HEDGE_H - n*APPLE_H - 14;
    ctx.beginPath(); ctx.arc(h.x, y, 16, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#3a4a3b";
    ctx.fillText("×" + game.stack.length, h.x, y+5);
  }
}
function drawGull(w){
  ctx.save(); ctx.translate(w.x, w.y);
  if(w.vx < 0) ctx.scale(-1,1);
  const flap = Math.sin(w.t*16);
  /* Flügel */
  ctx.fillStyle = "#dde6ee";
  ctx.beginPath();
  ctx.moveTo(-2,-2);
  ctx.quadraticCurveTo(-14, -14 - 10*flap, -30, -8 - 16*flap);
  ctx.quadraticCurveTo(-16, -2 - 4*flap, -2, 3);
  ctx.closePath(); ctx.fill();
  /* Schwanz */
  ctx.fillStyle = "#cfd8e0";
  ctx.beginPath(); ctx.moveTo(-13,-3); ctx.lineTo(-24,-6); ctx.lineTo(-13,3); ctx.closePath(); ctx.fill();
  /* Körper + Kopf */
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.ellipse(0,0, 16, 9, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(13,-6, 7, 0, Math.PI*2); ctx.fill();
  /* Schnabel */
  ctx.fillStyle = "#f0a10f";
  ctx.beginPath(); ctx.moveTo(19,-8); ctx.lineTo(28,-4); ctx.lineTo(19,-2); ctx.closePath(); ctx.fill();
  /* Auge */
  ctx.fillStyle = "#2c2c2c";
  ctx.beginPath(); ctx.arc(14,-7.5, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawPalm(x, y, s, flip){
  const night = game.cfg.night;
  ctx.save(); ctx.translate(x, y); ctx.scale(flip ? -s : s, s);
  /* Stamm */
  ctx.strokeStyle = night ? "#5a4630" : "#9a6b42";
  ctx.lineWidth = 11; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(10,-60,-6,-118); ctx.stroke();
  /* Blätter (wiegen sich im Wind) */
  ctx.strokeStyle = night ? "#1d5a40" : "#3fae72";
  ctx.lineWidth = 9;
  const sway = Math.sin(game.t*0.8)*4 + game.windX*0.05;
  [[-42,-24],[-32,10],[38,-18],[32,14],[2,-34]].forEach(([dx,dy],i)=>{
    ctx.beginPath(); ctx.moveTo(-6,-116);
    ctx.quadraticCurveTo(-6 + dx*0.6, -130 + dy, -6 + dx + sway*(i%2 ? 1 : -1), -102 + dy);
    ctx.stroke();
  });
  /* Kokosnüsse */
  ctx.fillStyle = "#6d4a2f";
  ctx.beginPath(); ctx.arc(-13,-112, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-2,-110, 5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function draw(){
  const c = game.cfg, gY = groundY();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if(game.shake > 0){
    ctx.translate(rand(-1,1)*game.shake*8, rand(-1,1)*game.shake*8);
  }
  /* Himmel */
  const sky = ctx.createLinearGradient(0,0,0,H);
  if(c.night){ sky.addColorStop(0,"#141a3d"); sky.addColorStop(1,"#2c3a68"); }
  else { sky.addColorStop(0,"#aee3ff"); sky.addColorStop(1,"#e7ffe3"); }
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);
  /* Sonne / Mond + Sterne */
  if(c.night){
    ctx.fillStyle = "#fff8d6";
    ctx.beginPath(); ctx.arc(W-70, 90, 26, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#2c3a68";
    ctx.beginPath(); ctx.arc(W-60, 82, 22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    for(let i=0;i<14;i++){
      const sx = (i*137)%W, sy = 30+(i*61)%200;
      ctx.fillRect(sx, sy, 2, 2);
    }
  }else{
    ctx.fillStyle = "#ffd66b";
    ctx.beginPath(); ctx.arc(W-70, 90, 30, 0, Math.PI*2); ctx.fill();
  }
  /* Meer mit Wellen */
  const seaY = gY - 90;
  const sea = ctx.createLinearGradient(0, seaY, 0, gY);
  if(c.night){ sea.addColorStop(0,"#16305c"); sea.addColorStop(1,"#1d3d6e"); }
  else { sea.addColorStop(0,"#3d8fe0"); sea.addColorStop(1,"#8fd8ff"); }
  ctx.fillStyle = sea; ctx.fillRect(0, seaY, W, gY - seaY + 20);
  ctx.strokeStyle = c.night ? "rgba(255,255,255,0.18)" : "rgba(255,255,255,0.5)";
  ctx.lineWidth = 2.5;
  for(let i = 0; i < 4; i++){
    const wy = seaY + 16 + i*20;
    const wx = ((game.t*22 + i*110) % (W+120)) - 60;
    ctx.beginPath();
    ctx.moveTo(wx, wy); ctx.quadraticCurveTo(wx+14, wy-4, wx+28, wy);
    ctx.quadraticCurveTo(wx+42, wy+4, wx+56, wy);
    ctx.stroke();
  }
  /* kleine Nachbar-Insel am Horizont */
  ctx.fillStyle = c.night ? "#2c3a55" : "#e8d49a";
  ctx.beginPath(); ctx.ellipse(W*0.8, seaY+8, 44, 12, 0, Math.PI, 0); ctx.fill();
  /* Insel-Sand */
  ctx.fillStyle = c.night ? "#6e6248" : "#f2d99a";
  ctx.beginPath();
  ctx.moveTo(0, gY+16); ctx.quadraticCurveTo(W/2, gY-10, W, gY+16);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = c.night ? "#5a5039" : "#e0c47f";
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(0, gY+16); ctx.quadraticCurveTo(W/2, gY-10, W, gY+16); ctx.stroke();
  /* Palmen */
  drawPalm(48, gY+8, 0.9, false);
  drawPalm(W-44, gY+10, 1.05, true);
  /* Wind-Anzeige */
  if(c.wind){
    ctx.strokeStyle = c.night ? "rgba(255,255,255,0.35)" : "rgba(90,140,110,0.5)";
    ctx.lineWidth = 2;
    const dir = Math.sign(game.windX) || 1, mag = Math.abs(game.windX)/c.wind;
    for(let i=0;i<3;i++){
      const y = 120 + i*36, x = (game.t*60*dir + i*160) % (W+80) - 40;
      const px = dir > 0 ? x : W - x;
      ctx.beginPath(); ctx.moveTo(px, y);
      ctx.quadraticCurveTo(px + 18*dir, y-5, px + 36*dir*Math.max(mag,0.3), y);
      ctx.stroke();
    }
  }
  /* Objekte */
  game.apples.forEach(a => drawApple(a.x, a.y, APPLE_R, a.type, a.rot));
  drawHedgehog();
  game.gulls.forEach(drawGull);
  /* Nacht-Maske mit Laternen-Licht */
  if(c.night){
    nctx.setTransform(scale, 0, 0, scale, 0, 0);
    nctx.clearRect(0,0,W,H);
    nctx.fillStyle = "rgba(8,10,30,0.78)";
    nctx.fillRect(0,0,W,H);
    nctx.globalCompositeOperation = "destination-out";
    const hole = (x,y,r)=>{
      const g = nctx.createRadialGradient(x,y,r*0.3, x,y,r);
      g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(1,"rgba(0,0,0,0)");
      nctx.fillStyle = g;
      nctx.beginPath(); nctx.arc(x,y,r,0,Math.PI*2); nctx.fill();
    };
    hole(game.hedge.x, stackTopY(), 200);
    game.apples.forEach(a => hole(a.x, a.y, 52));
    game.gulls.forEach(w => hole(w.x, w.y, 46));
    nctx.globalCompositeOperation = "source-over";
    ctx.setTransform(1,0,0,1,0,0);
    ctx.drawImage(nightCv, 0, 0);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
  }
  /* Partikel + Schwebe-Texte */
  game.parts.forEach(p=>{
    ctx.globalAlpha = Math.max(0, p.life/0.8);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  game.floats.forEach(f=>{
    ctx.globalAlpha = clamp(f.life/(f.maxLife*0.5), 0, 1);
    ctx.font = "bold " + f.size + "px 'Comic Sans MS','Segoe UI',sans-serif";
    ctx.textAlign = "center";
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;
}

/* ---------- Spiel-Schleife ---------- */
let lastT = 0;
function loop(now){
  requestAnimationFrame(loop);
  if(!game.active) { lastT = now; return; }
  const dt = Math.min((now - lastT)/1000, 0.05) * game.timeScale;
  lastT = now;
  if(game.state === "paused") return;
  update(dt);
  draw();
}
requestAnimationFrame(loop);

/* ---------- Eingabe ---------- */
const keys = {left:false, right:false};
window.addEventListener("keydown", e=>{
  if(e.key === "ArrowLeft" || e.key === "a" || e.key === "A"){ keys.left = true; e.preventDefault(); }
  if(e.key === "ArrowRight"|| e.key === "d" || e.key === "D"){ keys.right = true; e.preventDefault(); }
  if(e.key === "p" || e.key === "P"){ togglePause(); }
});
window.addEventListener("keyup", e=>{
  if(e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
  if(e.key === "ArrowRight"|| e.key === "d" || e.key === "D") keys.right = false;
});
let pointerDown = false;
function pointerToWorld(e){
  const r = cv.getBoundingClientRect();
  return (e.clientX - r.left) / r.width * W;
}
cv.addEventListener("pointerdown", e=>{ pointerDown = true; game.hedge.tx = pointerToWorld(e); audio.ensure(); });
cv.addEventListener("pointermove", e=>{ if(pointerDown) game.hedge.tx = pointerToWorld(e); });
window.addEventListener("pointerup", ()=>{ pointerDown = false; });
window.addEventListener("pointercancel", ()=>{ pointerDown = false; });

/* ---------- Pause ---------- */
function togglePause(){
  if(!game.active || (game.state !== "playing" && game.state !== "paused")) return;
  if(game.state === "playing"){
    game.state = "paused";
    showOverlay("Pause", "Kleine Verschnaufpause? 🦔", 0, [
      {id:"ov-next", label:"▶ Weiterspielen", cb:()=>{ game.state = "playing"; }},
      {id:"ov-retry", label:"↻ Level neu starten", cls:"blue", cb:()=>startLevel(game.level)},
      {id:"ov-levels", label:"🗺 Levelauswahl", cls:"gray", cb:openLevels}
    ]);
  }
}
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden && game.active && game.state === "playing") togglePause();
});
$("#btn-pause").addEventListener("click", togglePause);
$("#btn-sound").addEventListener("click", ()=>{
  store.data.sound = !store.data.sound; store.save(); audio.ensure(); updateHUD();
});

/* ---------- Levelauswahl ---------- */
function openLevels(){
  game.active = false; game.state = "idle";
  const grid = $("#level-grid"); grid.innerHTML = "";
  for(let n = 1; n <= MAX_LEVEL; n++){
    const b = document.createElement("button");
    const locked = n > store.data.unlocked;
    const stars = store.data.stars[n] || 0;
    b.className = "lvl-btn" + (locked ? " locked" : "") + (levelConfig(n).night ? " night" : "");
    b.dataset.level = n;
    b.innerHTML = locked ? "🔒" : n + '<span class="st">' + (stars ? "⭐".repeat(stars) : "&nbsp;") + "</span>";
    if(!locked) b.addEventListener("click", ()=>startLevel(n));
    grid.appendChild(b);
  }
  $("#lvl-total").textContent = "⭐ " + store.totalStars() + "/" + (MAX_LEVEL*3);
  showScreen("#scr-levels");
}

/* ---------- Start-Menü ---------- */
function openStart(){
  game.active = false; game.state = "idle";
  const u = store.data.unlocked;
  $("#btn-play").textContent = u > 1 ? "▶ Weiter: Level " + Math.min(u, MAX_LEVEL) : "▶ Spielen";
  $("#start-stars").textContent = store.totalStars() > 0
    ? "⭐ " + store.totalStars() + " Sterne · Level " + Math.min(u, MAX_LEVEL) + "/" + MAX_LEVEL
    : "Ab 8 Jahren · Pfeiltasten oder Finger";
  showScreen("#scr-start");
}
$("#btn-play").addEventListener("click", ()=>startLevel(Math.min(store.data.unlocked, MAX_LEVEL)));
$("#btn-levels").addEventListener("click", openLevels);
$("#btn-lvl-back").addEventListener("click", openStart);
$("#btn-help").addEventListener("click", ()=>{
  showOverlay("So geht's 🦔", [
    "🍎 Fange Äpfel mit deinen Stacheln – erreiche das Level-Ziel!",
    "🍏 Verpasster Apfel = 1 Herz weg (du hast 3).",
    "🟤 Faule Äpfel NICHT fangen – lass sie fallen!",
    "✨ Gold-Äpfel zählen 3-fach.",
    "🐦 Die Möwe klaut Äpfel vom Stapel – weich aus!",
    "🌬 Ab Level 25 weht Inselwind, ab Level 30 gibt es Nacht-Level.",
    "",
    "Steuerung: ← → Pfeiltasten, A/D oder Finger/Maus. P = Pause."
  ].join("\n"), 0, [
    {id:"ov-next", label:"Alles klar!", cb:()=>{}}
  ]);
});

/* ---------- Service Worker ---------- */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load", ()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));
}

/* ---------- Start + Test-API ---------- */
openStart();
resize();
window.__felixReady = true;
window.__felixTest = { game, startLevel, levelConfig, store, openLevels, openStart };
</script>
